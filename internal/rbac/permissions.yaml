# Single source for roles, aggregated ClusterRoles, the docs table and the
# route-permission lint (dev-docs/design-record.md §8.5, decision D31).
#
# resources: name -> verbs it supports
# roles:     name -> permissions as "<resource>.<verb>"; "*" wildcards allowed
# scoped:    roles that only make sense with a non-cluster scope

resources:
  zones: [read, write, delete, transfer, sign, share]
  records: [read, write, delete]
  blocklists: [read, write, delete, refresh]
  policies: [read, write, delete]
  clientgroups: [read, write, delete]
  clients: [read, write]
  querylog: [read, export, purge, raw]
  stats: [read]
  cache: [read, flush]
  blocking: [read, toggle]
  settings: [read, write]
  node: [config]
  dhcp: [read, write, delete]
  dhcpleases: [read, import, export]
  users: [read, write, delete]
  groups: [read, write, delete]
  serviceaccounts: [read, write, delete]
  tokens: [read, write, delete, own]
  identityproviders: [read, write, delete]
  rolebindings: [read, write, delete]
  tsigkeys: [read, write, delete]
  integrations: [read, write, delete, sync, check, secrets, act, release]
  cluster: [read, join, promote, drain]
  edge: [read, write]
  edgeblocks: [read, write]
  audit: [read, export]
  unblockrequests: [read, decide, delete]

roles:
  viewer:
    - zones.read
    - records.read
    - stats.read
    - cache.read
    - blocklists.read
    - policies.read
    - clientgroups.read
    - clients.read
    - blocking.read
    - settings.read
    - dhcp.read
    - tokens.own
  auditor:
    - zones.read
    - records.read
    - stats.read
    - cache.read
    - blocklists.read
    - policies.read
    - clientgroups.read
    - clients.read
    - blocking.read
    - settings.read
    - dhcp.read
    - dhcpleases.read
    - dhcpleases.export
    - querylog.read
    - querylog.export
    - audit.read
    - unblockrequests.read
    - edgeblocks.read
    - tokens.own
  operator:
    - zones.read
    - records.read
    - records.write
    - records.delete
    - stats.read
    - cache.read
    - cache.flush
    - blocklists.*
    - policies.*
    - clientgroups.*
    - clients.*
    - blocking.*
    - settings.read
    - dhcp.read
    - dhcpleases.read
    - dhcpleases.export
    - querylog.read
    - unblockrequests.*
    - edgeblocks.*
    - tokens.own
  zone-admin:
    - zones.read
    - zones.write
    - zones.delete
    - zones.transfer
    - zones.sign
    - zones.share
    - records.*
    - stats.read
    - cache.read
    - tokens.own
  admin:
    - "*.*"

scoped:
  - zone-admin

# Kubernetes ClusterRoles (§5.3, §8.5): `make rbac-manifests` generates
# deploy/helm/kudurru/templates/rbac-aggregated.yaml from the roles above.
# clusterRole is the name suffix (<release>-<clusterRole>); aggregateTo
# names the built-in ClusterRole it aggregates into. The auditor role
# reads query logs and the audit trail, so it aggregates nowhere: holders
# of the built-in view role must not gain client query history (bind
# kudurru-auditor explicitly). Scoped roles (zone-admin) have no
# ClusterRole: a namespaced RoleBinding with resourceNames on dnszones
# expresses them.
kubernetes:
  viewer: {clusterRole: viewer, aggregateTo: view}
  auditor: {clusterRole: auditor}
  operator: {clusterRole: editor, aggregateTo: edit}
  admin: {clusterRole: admin, aggregateTo: admin}

# Declared verbs that no route or handler checks yet, each with the release
# that is to use it (D393). TestPermissionVerbsAreUsedOrReserved fails for a
# declared verb that is neither checked nor listed here, and for an entry
# here that a route or handler already checks: remove the entry in the
# change that starts using the verb. Built-in roles may already grant a
# reserved verb; holding it allows nothing until it is used.
reserved:
  zones.sign: "v1.0: DNSSEC signing on the leader (design record 13.3, D14)"
  zones.share: "v1.0: delegating a zone to other principals from the API"
  clients.write: "v1.0: naming and editing client inventory entries"
  groups.read: "v1.0: local group administration (IAM write API)"
  groups.write: "v1.0: local group administration (IAM write API)"
  groups.delete: "v1.0: local group administration (IAM write API)"
  users.delete: "v1.0: deleting local accounts from the API"
  serviceaccounts.write: "v1.0: service account administration from the API"
  serviceaccounts.delete: "v1.0: service account administration from the API"
  tokens.write: "v1.0: issuing API tokens for another principal"
  identityproviders.write: "v1.0: identity provider administration from the API"
  identityproviders.delete: "v1.0: identity provider administration from the API"
  integrations.write: "v1.0: integration configuration from the API"
  integrations.delete: "v1.0: integration configuration from the API"
  integrations.secrets: "v1.0: reading and rotating integration credentials"
  cluster.drain: "v1.0: draining a member from the API (today only kudurru vip drain)"
  edge.write: "v1.0: edge configuration from the API"
