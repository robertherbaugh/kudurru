# Single source for roles, aggregated ClusterRoles, the docs table and the
# route-permission lint (docs/architecture.md §8.5, decision D31).
#
# resources: name -> verbs it supports
# roles:     name -> permissions as "<resource>.<verb>"; "*" wildcards allowed
# scoped:    roles that only make sense with a non-cluster scope

resources:
  zones: [read, write, delete, transfer, sign, share]
  records: [read, write, delete]
  blocklists: [read, write, delete, refresh]
  policies: [read, write, delete]
  clientgroups: [read, write, delete]
  clients: [read, write]
  querylog: [read, export, purge]
  stats: [read]
  cache: [read, flush]
  blocking: [read, toggle]
  settings: [read, write]
  node: [config]
  users: [read, write, delete]
  groups: [read, write, delete]
  serviceaccounts: [read, write, delete]
  tokens: [read, write, delete, own]
  identityproviders: [read, write, delete]
  rolebindings: [read, write, delete]
  integrations: [read, write, delete, sync, check, secrets, act]
  cluster: [read, join, promote, drain]
  edge: [read, write]
  audit: [read, export]

roles:
  viewer:
    - zones.read
    - records.read
    - stats.read
    - cache.read
    - blocklists.read
    - policies.read
    - clientgroups.read
    - clients.read
    - blocking.read
    - settings.read
    - tokens.own
  auditor:
    - zones.read
    - records.read
    - stats.read
    - cache.read
    - blocklists.read
    - policies.read
    - clientgroups.read
    - clients.read
    - blocking.read
    - settings.read
    - querylog.read
    - querylog.export
    - audit.read
    - tokens.own
  operator:
    - zones.read
    - records.read
    - records.write
    - records.delete
    - stats.read
    - cache.read
    - cache.flush
    - blocklists.*
    - policies.*
    - clientgroups.*
    - clients.*
    - blocking.*
    - settings.read
    - querylog.read
    - tokens.own
  zone-admin:
    - zones.read
    - zones.write
    - zones.delete
    - zones.transfer
    - zones.sign
    - zones.share
    - records.*
    - stats.read
    - cache.read
    - tokens.own
  admin:
    - "*.*"

scoped:
  - zone-admin

# Kubernetes aggregation: which built-in ClusterRole each role aggregates to.
kubernetes:
  viewer: view
  auditor: view
  operator: edit
  admin: admin
