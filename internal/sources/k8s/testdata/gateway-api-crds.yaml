# Test-only stand-ins for the Gateway API CRDs (gateway.networking.k8s.io).
# The repository does not depend on the Gateway API module, and the adapter
# reads these kinds as unstructured objects, so the envtest API server only
# needs to serve the resources: the schemas preserve every field.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api/pull/2466
  name: gateways.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  scope: Namespaced
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    singular: gateway
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
