version: "2"
run:
  timeout: 15m
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - revive
  exclusions:
    generated: lax
    paths:
      - zz_generated.*
formatters:
  enable:
    - gofmt
    - goimports
