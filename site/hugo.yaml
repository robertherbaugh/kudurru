# kudurru docs site (site/README.md). Content is mounted from docs/ and the
# repository root, so every page stays plain markdown that GitHub renders;
# only site/content holds pages of its own (landing pages, role pages,
# migration guides and the generated references). The architecture, the
# design record and the engineering notes (docs/architecture, docs/m*,
# docs/spikes, docs/research ...) are not published here: they are for
# contributors and live in the repository, where links to them resolve to
# GitHub.
title: kudurru
# The Pages workflow passes the real --baseURL; every template link goes
# through relURL/RelPermalink so the site also works below a sub-path.
baseURL: /
locale: en
enableRobotsTXT: true
disableKinds: [taxonomy, term, rss]
# Hugo's own URL for an _index.md mounted from a README.md stays the
# section path (/deploy/), and pages keep their file names.
uglyURLs: false
summaryLength: 30
timeout: 120s

params:
  description: "kudurru (koo-DOO-roo) is a Kubernetes-native DNS server that also runs as one container: authoritative zones, a forwarding resolver, blocking with client groups, a dashboard, OIDC and RBAC."
  tagline: "authority over every zone."
  repo: https://github.com/robertherbaugh/kudurru
  # Links from docs/ to repository files that are not pages point at this
  # ref; the Pages workflow sets HUGO_PARAMS_REPOREF to the tag it builds.
  repoRef: main

markup:
  goldmark:
    renderer:
      # docs/ is the project's own trusted markdown and uses <picture>, <br>
      # and anchors; generated tables use <br> and <a id>.
      unsafe: true
    parser:
      autoHeadingIDType: github
    extensions:
      typographer:
        disable: true
  highlight:
    noClasses: false
    guessSyntax: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

outputFormats:
  searchindex:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
    notAlternative: true

outputs:
  home: [html, searchindex]
  section: [html]
  page: [html]

menus:
  main:
    - {name: Get started, pageRef: /start, weight: 10}
    - {name: Guide, pageRef: /guide, weight: 15}
    - {name: Deploy, pageRef: /deploy, weight: 20}
    - {name: Migrate, pageRef: /migrate, weight: 30}
    - {name: Reference, pageRef: /reference, weight: 40}
    - {name: Project, pageRef: /project, weight: 70}

# Order of the mounted pages that carry no front matter of their own.
cascade:
  - {weight: 1, target: {path: /guide/user-guide}}
  - {weight: 2, target: {path: /guide/admin}}
  - {weight: 3, target: {path: /guide/style}}
  - {weight: 1, target: {path: /guide/admin/01-overview}}
  - {weight: 2, target: {path: /guide/admin/02-install-and-sign-in}}
  - {weight: 3, target: {path: /guide/admin/03-watch-the-network}}
  - {weight: 4, target: {path: /guide/admin/04-lists-and-domains}}
  - {weight: 5, target: {path: /guide/admin/05-groups-clients-policies}}
  - {weight: 6, target: {path: /guide/admin/06-access-requests}}
  - {weight: 7, target: {path: /guide/admin/07-zones-and-upstreams}}
  - {weight: 8, target: {path: /guide/admin/08-system}}
  - {weight: 9, target: {path: /guide/admin/09-people-and-tokens}}
  - {weight: 10, target: {path: /guide/admin/10-command-line}}
  - {weight: 11, target: {path: /guide/admin/11-maintenance}}
  - {weight: 12, target: {path: /guide/admin/12-troubleshooting}}
  - {weight: 1, target: {path: /deploy/docker}}
  - {weight: 2, target: {path: /deploy/compose-ha}}
  - {weight: 3, target: {path: /deploy/helm}}
  - {weight: 4, target: {path: /deploy/kustomize}}
  - {weight: 5, target: {path: /deploy/runbooks}}
  - {weight: 1, target: {path: /project/changelog}}
  - {weight: 2, target: {path: /project/security}}
  - {weight: 3, target: {path: /project/contributing}}

module:
  mounts:
    # The site's own pages, templates and styles.
    - {source: content, target: content}
    - {source: layouts, target: layouts}
    - {source: assets, target: assets}
    # Files served as they are: _headers (Cloudflare response headers).
    - {source: static, target: static}

    # The user and administrator guide (docs/guide). Its images are served from
    # the site itself (render-image.html), not from raw.githubusercontent.com:
    # the repository can be private, and a public site must not depend on it.
    - {source: ../docs/guide/README.md, target: content/guide/_index.md}
    - {source: ../docs/guide/admin/README.md, target: content/guide/admin/_index.md}
    - source: ../docs/guide
      target: content/guide
      files: ['! README.md', '! admin/README.md', '! images/**']

    - {source: ../docs/guide/images, target: static/guide/images}

    # User and operator guides, runbooks.
    - {source: ../docs/deploy/README.md, target: content/deploy/_index.md}
    - {source: ../docs/deploy, target: content/deploy, files: ['! README.md']}

    # Project files from the repository root.
    - {source: ../CHANGELOG.md, target: content/project/changelog.md}
    - {source: ../SECURITY.md, target: content/project/security.md}
    - {source: ../CONTRIBUTING.md, target: content/project/contributing.md}

    # Brand (docs/brand): palette and the artwork the templates use.
    - {source: ../docs/brand/tokens.css, target: assets/css/tokens.css}
    - source: ../docs/brand/assets
      target: static/brand
      files:
        - favicon.ico
        - kudurru-icon-192.png
        - kudurru-icon-512.png
        - kudurru-logo-mixed.png
        - kudurru-logo-mixed-paper.png
        - kudurru-logo-mixed-tagline.png
        - kudurru-logo-mixed-paper-tagline.png
        - kudurru-mark-clay.png
        - kudurru-social.png

    # REST reference: the OpenAPI document and the self-hosted Scalar
    # bundle (MIT; `make docs-assets` decompresses it into .generated/).
    - {source: ../api/openapi.json, target: static/reference/api/openapi.json}
    - {source: ../internal/api/scalar/LICENSE, target: static/reference/api/scalar-LICENSE.txt}
    - {source: .generated/scalar, target: assets/scalar}
