# htmltest (MIT) over the site built below a sub-path, the way GitHub Pages
# serves it (make docs-check-links). The Hugo build already fails on a
# broken link in the markdown (render-link.html, --panicOnWarning); this
# checks the rendered HTML as a whole: template links, assets, fragments.
DirectoryPath: bin/docs-links
CheckExternal: false
CheckInternalHash: true
IgnoreDirectoryMissingTrailingSlash: true
EnforceHTTPS: false
# Decorative images (the footer mark) carry alt="" on purpose.
IgnoreAltEmpty: true
OutputDir: bin/docs-links-log
