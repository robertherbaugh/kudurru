{{- if .Values.networkPolicy.enabled }}
{{- $edgeMode := include "kudurru.edge.mode" . -}}
{{- $s := .Values.service -}}
# Ingress to the kudurru pods (§5.4): PROXYv2 :5353 only from edge pods,
# the internal listener :8082 only from kudurru and edge pods. Egress stays
# open (upstream resolvers, the apiserver, blocklist downloads).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kudurru.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if or (not $edgeMode) (eq $edgeMode "sidecar") }}
    # DNS clients (directly, or through the dnsdist sidecar on :53).
    {{- $dnsPort := ternary 53 .Values.listen.port (eq $edgeMode "sidecar") }}
    - ports:
        - port: {{ $dnsPort }}
          protocol: UDP
        - port: {{ $dnsPort }}
          protocol: TCP
        {{- if $s.dot.enabled }}
        - port: {{ $s.dot.port }}
          protocol: TCP
        {{- end }}
        {{- if $s.doq.enabled }}
        - port: {{ $s.doq.port }}
          protocol: UDP
        {{- end }}
        {{- if $s.doh.enabled }}
        - port: {{ $s.doh.port }}
          protocol: TCP
        {{- end }}
        {{- if $s.doh3.enabled }}
        - port: {{ $s.doh3.port }}
          protocol: UDP
        {{- end }}
    {{- else }}
    # PROXYv2 DNS only from the edge (the TLV authenticates, this narrows).
    - from:
        - podSelector:
            matchLabels:
              {{- include "kudurru.edge.selectorLabels" . | nindent 14 }}
        {{- if eq $edgeMode "daemonset" }}
        # hostNetwork edge pods arrive from node addresses.
        {{- range .Values.edge.proxyProtocolFrom }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
      ports:
        - port: {{ .Values.edge.backendPort }}
          protocol: UDP
        - port: {{ .Values.edge.backendPort }}
          protocol: TCP
    {{- end }}
    # Internal listener: list bodies by digest, /internal/status, zone serials.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kudurru.selectorLabels" . | nindent 14 }}
        {{- if $edgeMode }}
        - podSelector:
            matchLabels:
              {{- include "kudurru.edge.selectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - port: 8082
          protocol: TCP
    # API and UI.
    - ports:
        - port: 8080
          protocol: TCP
        {{- if .Values.externalDNS.webhook.enabled }}
        - port: {{ .Values.externalDNS.webhook.port }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.blockPage.enabled }}
    # Block page: every client a blocked name was sent to.
    - ports:
        - port: {{ .Values.blockPage.httpPort }}
          protocol: TCP
        {{- if .Values.blockPage.https.enabled }}
        - port: {{ .Values.blockPage.https.port }}
          protocol: TCP
        {{- end }}
    {{- end }}
    # Probes (kubelet) on the unauthenticated ops listener{{ if eq $edgeMode "sidecar" }}, and the dnsdist
    # sidecar's supervisor (readiness, /metrics){{ end }}.
    - ports:
        - port: 8081
          protocol: TCP
        {{- if eq $edgeMode "sidecar" }}
        - port: 8084
          protocol: TCP
        {{- end }}
    # Prometheus.
    - ports:
        - port: 9153
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if eq $edgeMode "deployment" }}
---
# Ingress to the edge pods: DNS from anywhere, supervisor readiness.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kudurru.fullname" . }}-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kudurru.edge.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        {{- if $s.dot.enabled }}
        - port: {{ $s.dot.port }}
          protocol: TCP
        {{- end }}
        {{- if $s.doq.enabled }}
        - port: {{ $s.doq.port }}
          protocol: UDP
        {{- end }}
        {{- if $s.doh.enabled }}
        - port: {{ $s.doh.port }}
          protocol: TCP
        {{- end }}
        {{- if $s.doh3.enabled }}
        - port: {{ $s.doh3.port }}
          protocol: UDP
        {{- end }}
        - port: 8084
          protocol: TCP
{{- end }}
{{- end }}
