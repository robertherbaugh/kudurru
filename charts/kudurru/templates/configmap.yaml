# Two ConfigMaps (D25). <fullname>-node is the file `serve --config` reads;
# its checksum annotation rolls the pods. <fullname>-settings carries the
# cluster-scoped keys and is mounted at /etc/kudurru/settings for hot
# reload; until the binary reads it, the node file includes the same keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kudurru.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
data:
  kudurru.yaml: |
    {{- include "kudurru.nodeConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kudurru.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
data:
  settings.yaml: |
    {{- toYaml (.Values.config.settings | default dict) | nindent 4 }}
