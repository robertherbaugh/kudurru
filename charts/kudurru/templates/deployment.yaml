apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "kudurru.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kudurru.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Only the node ConfigMap rolls pods; settings changes never restart (D25).
        checksum/node-config: {{ include "kudurru.nodeConfig" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kudurru.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      dnsPolicy: {{ if .Values.hostNetwork.enabled }}ClusterFirstWithHostNet{{ else }}{{ .Values.dnsPolicy }}{{ end }}
      hostNetwork: {{ .Values.hostNetwork.enabled }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kudurru
          image: {{ include "kudurru.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config=/etc/kudurru/kudurru.yaml
          env:
            - name: KUDURRU_NODE__NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: dns-udp
              containerPort: {{ .Values.listen.port }}
              protocol: UDP
            - name: dns-tcp
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: ops
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: ops
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: ops
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: node-config
              mountPath: /etc/kudurru
              readOnly: true
            - name: settings
              mountPath: /etc/kudurru/settings
              readOnly: true
            - name: data
              mountPath: /var/lib/kudurru
            - name: run
              mountPath: /run/kudurru
      volumes:
        - name: node-config
          configMap:
            name: {{ include "kudurru.fullname" . }}-node
        - name: settings
          configMap:
            name: {{ include "kudurru.fullname" . }}-settings
        - name: data
          emptyDir: {}
        - name: run
          emptyDir:
            medium: Memory
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "kudurru.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
