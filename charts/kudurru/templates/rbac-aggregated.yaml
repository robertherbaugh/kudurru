{{- if and .Values.rbac.create .Values.rbac.aggregateToDefaultRoles (not (include "kudurru.standalone" .)) }}
# User-facing roles: real CRDs plus the virtual resources kudurru checks
# with SubjectAccessReview (§5.5). Custom verbs (flush, toggle, refresh,
# export, ...) are what SubjectAccessReview asks for those operations.
# kudurru role "viewer".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-viewer
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["blocking", "blocklists", "caches", "clientgroups", "clients", "dnsrecordsets", "dnszones", "policies", "settings", "stats"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kudurru.io"]
    resources: ["tokens"]
    verbs: ["own"]
---
# kudurru role "auditor".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-auditor
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["audits", "blocking", "blocklists", "caches", "clientgroups", "clients", "dnsrecordsets", "dnszones", "policies", "settings", "stats", "unblockrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kudurru.io"]
    resources: ["querylogs"]
    verbs: ["get", "list", "watch", "export"]
  - apiGroups: ["kudurru.io"]
    resources: ["tokens"]
    verbs: ["own"]
---
# kudurru role "operator".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-editor
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones", "querylogs", "settings", "stats"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kudurru.io"]
    resources: ["clients"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kudurru.io"]
    resources: ["clientgroups", "dnsrecordsets", "policies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kudurru.io"]
    resources: ["blocklists"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "refresh"]
  - apiGroups: ["kudurru.io"]
    resources: ["unblockrequests"]
    verbs: ["get", "list", "watch", "delete", "decide"]
  - apiGroups: ["kudurru.io"]
    resources: ["caches"]
    verbs: ["get", "list", "watch", "flush"]
  - apiGroups: ["kudurru.io"]
    resources: ["blocking"]
    verbs: ["get", "list", "watch", "toggle"]
  - apiGroups: ["kudurru.io"]
    resources: ["tokens"]
    verbs: ["own"]
---
# kudurru role "admin".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-admin
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["*"]
    verbs: ["*"]
{{- end }}
