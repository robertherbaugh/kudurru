{{- /*
Generated-once Secrets (§4.5). Each is created only when the matching value
names no existing Secret, reuses its current value on upgrade (lookup), and
survives `helm uninstall` (helm.sh/resource-policy: keep) so sessions,
internal credentials and encrypted state stay readable after a reinstall.
`helm template` has no cluster to look up and renders fresh random values.
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- if not .Values.auth.encryptionKeySecret }}
{{- $name := include "kudurru.encryptionKeySecret" . -}}
{{- $key := include "kudurru.lookupSecretValue" (dict "ns" $ns "name" $name "key" "key") | default (randBytes 32 | b64enc) }}
---
# Cluster encryption key: sealed sessions, stored secrets, and the HKDF root
# of the internal listener's token and CA (D47, D92). KUDURRU_ENCRYPTION_KEY_FILE.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kudurru.io/session-key
data:
  key: {{ $key }}
{{- end }}
{{- if and .Values.license.key (not .Values.license.existingSecret) }}
---
# License key (KUDURRU_LICENSE_KEY, docs/architecture/licensing.md). Prefer
# license.existingSecret so the key stays out of values files.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kudurru.licenseSecret" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.license.secretKey }}: {{ .Values.license.key | quote }}
{{- end }}
{{- if not .Values.auth.bootstrapAdminSecret }}
{{- $name := include "kudurru.adminSecret" . -}}
{{- $password := include "kudurru.lookupSecretValue" (dict "ns" $ns "name" $name "key" "password") | default (randAlphaNum 24 | b64enc) }}
---
# First-start admin (KUDURRU_ADMIN_PASSWORD_FILE, §8.7). Read it with the
# command in the release notes; the UI asks for a new password at first login.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
data:
  username: {{ "admin" | b64enc }}
  password: {{ $password }}
{{- end }}
{{- if and .Values.auth.bootstrapToken.enabled (not .Values.auth.bootstrapToken.existingSecret) }}
{{- $name := include "kudurru.bootstrapTokenSecret" . -}}
{{- $token := include "kudurru.lookupSecretValue" (dict "ns" $ns "name" $name "key" "token") | default (printf "kdr_%s_%s" (randAlphaNum 12) (randAlphaNum 43) | b64enc) }}
---
# Bootstrap service-account token (KUDURRU_BOOTSTRAP_TOKEN_FILE, §8.7),
# wire format kdr_<12-char id>_<43-char secret>; stored hashed by kudurru.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token }}
{{- end }}
{{- if and .Values.edge.enabled (ne (include "kudurru.edge.mode" .) "sidecar") (not .Values.edge.existingSecret) }}
{{- $name := include "kudurru.proxySecret" . -}}
{{- $value := "" -}}
{{- if .Values.edge.proxyProtocolSecret -}}
{{- if lt (len .Values.edge.proxyProtocolSecret) 32 }}{{ fail "edge.proxyProtocolSecret must be at least 32 bytes" }}{{ end -}}
{{- $value = .Values.edge.proxyProtocolSecret | b64enc -}}
{{- else -}}
{{- $value = include "kudurru.lookupSecretValue" (dict "ns" $ns "name" $name "key" "proxy-protocol-secret") | default (randAlphaNum 64 | b64enc) -}}
{{- end }}
---
# PROXYv2 TLV 0xE0 secret shared by the edge and kudurru pods (§3.3, D72):
# listeners.proxyProtocolSecretFile on kudurru, --proxy-protocol-secret-file
# on the supervisor.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  proxy-protocol-secret: {{ $value }}
{{- end }}
{{- if and .Values.edge.enabled (eq .Values.vip.provider "keepalived") (not .Values.vip.keepalived.existingSecret) }}
{{- $name := include "kudurru.vrrpSecret" . -}}
{{- $value := "" -}}
{{- if .Values.vip.keepalived.hmacSecret -}}
{{- $value = .Values.vip.keepalived.hmacSecret | b64enc -}}
{{- else -}}
{{- $value = include "kudurru.lookupSecretValue" (dict "ns" $ns "name" $name "key" "vrrp-hmac") | default (randAlphaNum 32 | b64enc) -}}
{{- end }}
---
# keepalived auth_hmac key (VRRPv3 adverts, §3.6).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kudurru.edge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  vrrp-hmac: {{ $value }}
{{- end }}
