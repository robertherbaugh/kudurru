{{- if and .Values.rbac.create (not (include "kudurru.standalone" .)) }}
# Least-privilege RBAC for the kudurru ServiceAccount (§5.3, D77). The
# standalone mode (sqlite store) talks to no Kubernetes API and gets none.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
rules:
  # Server-side apply needs create+patch; file-managed objects and
  # finalizers need delete (D77).
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones", "dnsrecordsets", "blocklists", "clientgroups", "policies", "unblockrequests"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones/status", "dnsrecordsets/status", "blocklists/status", "clientgroups/status", "policies/status", "unblockrequests/status"]
    verbs: ["update", "patch"]
  # DNSEndpoint compatibility watch (read-only, never owned, §5.1).
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]
  # kube-system uid as the cluster id (D77); Services for LoadBalancer status.
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list", "watch"]
  # Peers of the headless Service (Nodes page scatter-gather, §5.3).
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Events on kudurru.io objects in any namespace.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Kubernetes identities: ServiceAccount tokens and SubjectAccessReview
  # authorization (system:auth-delegator equivalent, §5.5).
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kudurru.fullname" . }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kudurru.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kudurru.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Release namespace only: Leases (Elector(name) → Lease kudurru-<name>,
# D78), Secrets for internal kinds (tokens, users, TSIG, DNSSEC keys;
# revoking a token and deleting a user or RoleBinding delete their
# Secrets), ConfigMaps for runtime state (blocking toggle replication) and
# the AuditLog batches of the audit log (D157).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
  # Created and, after audit.retention, deleted; never updated, so the
  # ServiceAccount cannot rewrite a recorded batch.
  - apiGroups: ["audit.kudurru.io"]
    resources: ["auditlogs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kudurru.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kudurru.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- /* The user-facing aggregated ClusterRoles are generated: rbac-aggregated.yaml. */}}
{{- end }}
