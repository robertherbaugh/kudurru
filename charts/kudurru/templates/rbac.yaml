{{- if and .Values.rbac.create (not (include "kudurru.standalone" .)) }}
# Least-privilege RBAC for the kudurru ServiceAccount (§5.3, D77). The
# standalone mode (sqlite store) talks to no Kubernetes API and gets none.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
rules:
  # Server-side apply needs create+patch; file-managed objects and
  # finalizers need delete (D77).
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones", "dnsrecordsets", "blocklists", "clientgroups", "policies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones/status", "dnsrecordsets/status", "blocklists/status", "clientgroups/status", "policies/status"]
    verbs: ["update", "patch"]
  # DNSEndpoint compatibility watch (read-only, never owned, §5.1).
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]
  # kube-system uid as the cluster id (D77); Services for LoadBalancer status.
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list", "watch"]
  # Peers of the headless Service (Nodes page scatter-gather, §5.3).
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Events on kudurru.io objects in any namespace.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Kubernetes identities: ServiceAccount tokens and SubjectAccessReview
  # authorization (system:auth-delegator equivalent, §5.5).
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kudurru.fullname" . }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kudurru.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kudurru.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Release namespace only: Leases (Elector(name) → Lease kudurru-<name>,
# D78), Secrets for internal kinds (tokens, users, TSIG, DNSSEC keys) and
# ConfigMaps for runtime state (blocking toggle replication).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kudurru.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kudurru.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.aggregateToDefaultRoles }}
---
# User-facing roles (D31): real CRDs plus the virtual resources kudurru
# checks with SubjectAccessReview (§5.5). They aggregate into the built-in
# view/edit/admin roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-viewer
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones", "dnsrecordsets", "blocklists", "clientgroups", "policies", "stats", "caches", "blocking"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-editor
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones", "stats", "querylogs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kudurru.io"]
    resources: ["dnsrecordsets", "blocklists", "clientgroups", "policies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kudurru.io"]
    resources: ["caches", "blocking"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-admin
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kudurru.fullname" . }}-auditor
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kudurru.io"]
    resources: ["dnszones", "dnsrecordsets", "blocklists", "clientgroups", "policies", "stats", "querylogs", "audits", "settings"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- end }}
