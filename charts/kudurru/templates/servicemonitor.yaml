{{- if .Values.serviceMonitor.enabled }}
# Scrapes :9153 through the API Service (one endpoint per kudurru pod).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kudurru.selectorLabels" . | nindent 6 }}
      kudurru.io/service: api
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        # The dashboards and alerts group by pod.
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
{{- end }}
{{- if .Values.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "kudurru.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kudurru.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kudurru.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
{{- end }}
