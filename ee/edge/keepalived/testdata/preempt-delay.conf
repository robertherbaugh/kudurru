# Generated by `kudurru vip run` (dev-docs/design-record.md §3.6). Do not edit: the
# supervisor validates every render with `keepalived -t` and reloads with SIGHUP.

global_defs {
    router_id node-a
    enable_script_security
    script_user keepalived_script
    vrrp_version 3
    vrrp_garp_master_refresh 30
    vrrp_notify_fifo /var/run/kudurru/vrrp.fifo
    vrrp_notify_fifo_script "/usr/local/bin/kudurru vip fifo --node node-a --run-dir /var/run/kudurru"
}

vrrp_script chk_dns {
    script "/usr/local/bin/kudurru health --vrrp --dns 10.0.0.53:53 --qname health.kudurru.internal. --dnsdist-api http://127.0.0.1:8083 --dnsdist-api-key-file /var/run/kudurru/dnsdist-api.key --require-backends 1"
    interval 1
    timeout 1
    fall 3
    rise 2
    weight 0
    user keepalived_script
}

track_file tf_dns {
    file "/var/run/kudurru/weight-dns"
    weight -1
    init_file 0
}

vrrp_instance VI_dns {
    state BACKUP
    interface eth0
    virtual_router_id 53
    priority 200
    advert_int 1
    preempt_delay 60
    unicast_src_ip 10.0.0.11
    unicast_peer {
        10.0.0.12
        10.0.0.13
    }
    unicast_fault_no_peer
    check_unicast_src
    auth_hmac {
        key 1 file:/run/secrets/vrrp_hmac_53
        active_key 1
        anti_replay monotonic
    }
    virtual_ipaddress {
        10.0.0.53/24 dev eth0
    }
    track_script {
        chk_dns
    }
    track_file {
        tf_dns
    }
}
