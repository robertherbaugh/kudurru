# PostgreSQL for the central database of hack/kind-e2e.sh (docs/deploy/
# postgres.md): one StatefulSet pod on a PVC, so the data survives scaling
# it to zero for the outage test. The Secret holds the connection string
# under "uri" (chart value database.existingSecret, database.dsnKey) and the
# role's password for the server. Applied with `kubectl -n <namespace>`.
# The image is the one the Go jobs of ci.yml test against.
apiVersion: v1
kind: Secret
metadata:
  name: kudurru-db
type: Opaque
stringData:
  uri: postgres://kudurru:kudurru@postgres:5432/kudurru?sslmode=disable
  password: kudurru
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - name: POSTGRES_USER
              value: kudurru
            - name: POSTGRES_DB
              value: kudurru
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: kudurru-db, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kudurru", "-d", "kudurru"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
