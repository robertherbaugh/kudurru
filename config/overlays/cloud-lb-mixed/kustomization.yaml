# Cloud load balancer with one mixed-protocol (UDP+TCP :53) Service, which
# every major cloud supports since Kubernetes 1.26. The annotations target
# the AWS Load Balancer Controller (NLB, IP targets so client addresses are
# preserved with externalTrafficPolicy Local); on GKE and AKS the default
# LoadBalancer already works: drop the annotations or replace them with
# networking.gke.io/load-balancer-type: Internal or
# service.beta.kubernetes.io/azure-load-balancer-internal: "true".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../default
patches:
  - target:
      kind: Service
      name: kudurru-dns
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      - op: replace
        path: /spec/externalTrafficPolicy
        value: Local
