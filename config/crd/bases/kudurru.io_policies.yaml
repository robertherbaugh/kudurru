---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: policies.kudurru.io
spec:
  group: kudurru.io
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    shortNames:
    - pol
    singular: policy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clientGroupRefs
      name: GROUPS
      type: string
    - jsonPath: .spec.priority
      name: PRIORITY
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Policy applies lists, schedules and resolver settings to client
          groups.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolicySpec binds client groups to lists and resolver behaviour.
            properties:
              allowListRefs:
                items:
                  type: string
                type: array
              allowOnly:
                description: AllowOnly answers only names present in the allow lists.
                type: boolean
              allowedServices:
                description: |-
                  AllowedServices are exceptions to blockedCategories: services of a
                  blocked category this policy does not block. They do not cancel an
                  ID listed in blockedServices, nor another policy's blocks; allow
                  lists still win over every service.
                items:
                  pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              blockListRefs:
                items:
                  type: string
                type: array
              blockMode:
                description: |-
                  BlockResponse is how a blocked query is answered: nxdomain, zeroIP
                  (0.0.0.0 / ::), refused, customIP (the customIP addresses) or blockPage
                  (the addresses of the block page listener, blockPage.ipv4/ipv6, so
                  browsers show why the name is blocked).
                enum:
                - nxdomain
                - zeroIP
                - refused
                - customIP
                - blockPage
                type: string
              blockTTL:
                default: 10m
                type: string
              blockedCategories:
                description: |-
                  BlockedCategories names categories of the catalogue
                  (GET /api/v1/catalogue/categories: ai, social, gaming, ...); every
                  service in them is blocked as if listed in blockedServices, including
                  services a later catalogue adds to the category. Unknown IDs are
                  reported as Degraded{UnknownCategory}.
                items:
                  pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              blockedServices:
                description: |-
                  BlockedServices names services of the blocked-services catalogue
                  (GET /api/v1/catalogue/services: youtube, tiktok, ...) whose domains
                  this policy blocks like a block list; the query log names the
                  service as the list, "service:<id>". IDs are checked against the
                  catalogue in service, which can change at runtime, so an unknown ID
                  is reported as Degraded{UnknownService} rather than refused.
                items:
                  pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              clientGroupRefs:
                items:
                  type: string
                type: array
              priority:
                description: Priority breaks ties when several policies match; highest
                  wins.
                type: integer
              queryLog:
                description: QueryLog false excludes matching clients from the query
                  log.
                type: boolean
              rewrites:
                items:
                  description: Rewrite rewrites answers for matching names (v0.2).
                  properties:
                    cname:
                      type: string
                    name:
                      type: string
                    targets:
                      items:
                        type: string
                      type: array
                    type:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              safeSearch:
                description: |-
                  SafeSearch true answers the search engines' and YouTube's host names
                  with their vendor's safe-search target (a CNAME to
                  forcesafesearch.google.com, strict.bing.com, ...; see the catalogue).
                type: boolean
              safeSearchMode:
                description: |-
                  SafeSearchMode is the level for engines that offer two: strict (the
                  default) or moderate. Only YouTube has two levels (Strict or
                  Moderate Restricted Mode); every other engine is always strict.
                enum:
                - strict
                - moderate
                type: string
              schedule:
                description: Schedule limits when a policy applies.
                properties:
                  end:
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                  start:
                    description: Start and End are "HH:MM" in TZ.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                  tz:
                    default: UTC
                    type: string
                  weekdays:
                    items:
                      type: string
                    type: array
                required:
                - end
                - start
                type: object
              upstreamGroup:
                type: string
            type: object
          status:
            description: PolicyStatus is the observed state of a policy.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
