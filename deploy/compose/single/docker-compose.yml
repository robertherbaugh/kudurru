# Single instance. Profile "edge" adds dnsdist in front (M4).
# Secrets: create ./secrets/admin_password and ./secrets/encryption_key first.
services:
  kudurru:
    image: ghcr.io/robertherbaugh/kudurru:0.1.0-dev
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8080:8080"
    environment:
      KUDURRU_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      KUDURRU_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      TZ: UTC
    volumes:
      - ./kudurru.yaml:/etc/kudurru/kudurru.yaml:ro
      - ./objects.d:/etc/kudurru/objects.d:ro
      - kudurru-data:/var/lib/kudurru
    secrets: [admin_password, encryption_key]
    healthcheck:
      test: ["CMD", "kudurru", "health", "--ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    cap_add: [NET_BIND_SERVICE]

  # dnsdist edge tier (M4): kudurru then listens on 127.0.0.1:5353 behind it.
  dnsdist:
    profiles: [edge]
    image: ghcr.io/robertherbaugh/kudurru-dnsdist:2.1.2-k0.1.0-dev
    command: ["kudurru", "edge", "run", "--backends", "127.0.0.1:5353", "--tls-dir", "/certs"]
    network_mode: "service:kudurru"
    volumes:
      - certs:/certs:ro
    depends_on: [kudurru]

volumes:
  kudurru-data: {}
  certs: {}

secrets:
  admin_password:
    file: ./secrets/admin_password
  encryption_key:
    file: ./secrets/encryption_key
