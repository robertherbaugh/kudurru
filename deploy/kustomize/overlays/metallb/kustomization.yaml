# MetalLB: pin the DNS address (and pool) of the mixed-protocol Service.
# MetalLB 0.13+ serves mixed TCP/UDP on one Service; on older releases use
# the chart with service.dns.splitProtocols=true (metallb.io/allow-shared-ip).
# Replace 192.0.2.53 and the pool name with yours.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../default
patches:
  - target:
      kind: Service
      name: kudurru-dns
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          metallb.io/loadBalancerIPs: 192.0.2.53
          metallb.io/address-pool: default
