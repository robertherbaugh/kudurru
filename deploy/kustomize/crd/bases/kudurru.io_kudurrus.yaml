                                it bounds the whole lookup of a name instead (default
                                4s).
                              maxLength: 8192
                              type: string
                          type: object
                        description: The DNS servers kudurru asks for names it does
                          not answer itself, in named groups; the group named default
                          gets every query nothing else routes. Each group lists servers
                          (e.g. 1.1.1.1, tls://dns.quad9.net), a strategy that picks
                          among them and a timeout per server. Conditional forwarding,
                          forward zones and policies send queries to other groups
                          by name.
