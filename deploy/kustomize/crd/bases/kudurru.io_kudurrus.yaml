                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                      conditional:
                        additionalProperties:
                          maxLength: 8192
                          type: string
                        description: Send queries for some domains to a chosen upstream
                          group, e.g. home.lan to a group holding your router, so
                          local device names resolve. Each entry maps a domain suffix
                          to a group name; the longest matching suffix wins, and a
                          key may list several suffixes in dnsmasq form, "[/corp.example/10.in-addr.arpa/]".
                          These answers are never cached.
                        maxProperties: 10000
                        type: object
                      ecs:
                        properties:
                          ipv4Prefix:
                            description: 'How much of an IPv4 client address EDNS
                              Client Subnet may reveal, as a prefix length from 0
                              to 32: with 24 (default) only the network, e.g. 203.0.113.0/24,
                              is sent. Used only when upstreams.ecs.mode is forward
                              or add.'
