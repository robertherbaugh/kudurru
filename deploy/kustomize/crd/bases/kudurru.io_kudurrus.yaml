apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: kudurrus.kudurru.io
spec:
  group: kudurru.io
  names:
    kind: Kudurru
    listKind: KudurruList
    plural: kudurrus
    singular: kudurru
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Kudurru is the cluster settings singleton named default.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KudurruSpec owns cluster configuration. The generator replaces Settings'
              generic Go carrier with the strict nested schema from config.Schema.
            properties:
              settings:
                properties:
                  auth:
                    properties:
                      localLogin:
                        description: 'Whether people can sign in to the dashboard
                          with a username and password: enabled for everyone, admins-only
                          for builtin admins, or disabled (identity providers only).
                          `kudurru admin` on the server''s admin socket always works,
                          so you cannot lock yourself out. Gates POST /api/v1/auth/login.'
                        enum:
                        - enabled
                        - admins-only
                        - disabled
                        maxLength: 8192
                        type: string
                      session:
                        properties:
                          idleTimeout:
                            description: Sign a dashboard user out after this long
                              without activity, e.g. 30m; at least 1m. Every request
                              starts the time again.
                            maxLength: 8192
                            type: string
                          lifetime:
                            description: Longest a dashboard sign-in lasts however
                              active it is, e.g. 12h; then the user signs in again
                              and their roles are looked up afresh. At least auth.session.idleTimeout.
                            maxLength: 8192
                            type: string
                          secure:
                            description: Whether browsers send the session cookie
                              only over HTTPS (the cookie's Secure attribute). auto
                              (default) decides per request and suits most setups;
                              always is for a proxy that terminates TLS without telling
                              kudurru; never is only for plain HTTP on a network you
                              trust.
                            enum:
                            - auto
                            - always
                            - never
                            maxLength: 8192
                            type: string
                        type: object
                      tokens:
                        properties:
                          maxLifetime:
                            description: Longest lifetime of a new API token, e.g.
                              2160h (90 days); a token created without an expiry gets
                              this one. 0 (default) allows tokens that never expire.
                            maxLength: 8192
                            type: string
                        type: object
                    type: object
                  blockPage:
                    properties:
                      contact:
                        description: 'How people reach you, shown as "Ask your administrator":
                          an email address, e.g. admin@home.example, or a link, e.g.
                          https://wiki.home.example/dns. Empty leaves the line out.'
                        maxLength: 8192
                        type: string
                      dashboardURL:
                        description: Address of the dashboard the block page links
                          administrators to, e.g. https://192.168.1.10:8080; the link
                          opens /queries?domain=... there. Empty builds it from the
                          block page address and listeners.api; set it when the dashboard
                          is reached under another name or through a reverse proxy.
                        maxLength: 8192
                        type: string
                      enabled:
                        description: Show browsers a page that explains why a site
                          was blocked, instead of a connection error. Turning it on
                          starts the block page listener (listeners.blockPage) and
                          allows the blockPage block response; choose that response
                          in blocking.defaultResponse or a Policy. Blocked A and AAAA
                          queries then point at blockPage.ipv4 and blockPage.ipv6;
                          other types get NODATA.
                        type: boolean
                      ipv4:
                        description: 'Address browsers are sent to for the block page,
                          e.g. 192.168.1.10: this server''s LAN address, or a VIP
                          or load balancer in front of the block page. Blocked A queries
                          are answered with it under the blockPage response. Empty
                          picks the first specific address of listeners.blockPage,
                          else of listeners.dns; when every listener binds all addresses
                          (0.0.0.0, ::) there is none, and blockPage.enabled is refused.'
                        maxLength: 8192
                        type: string
                      ipv6:
                        description: IPv6 address browsers are sent to for the block
                          page, e.g. fd00::10; blocked AAAA queries are answered with
                          it under the blockPage response. When blockPage.ipv4 is
                          empty too, one is picked from the listeners as for IPv4;
                          without an IPv6 address, AAAA queries get NODATA and browsers
                          use IPv4.
                        maxLength: 8192
                        type: string
                      message:
                        description: Text under the heading that tells people why
                          the site is blocked and what they can do (plain text, at
                          most 2000 characters; HTML is shown as text).
                        maxLength: 8192
                        type: string
                      rateLimit:
                        description: Most block page requests one client address may
                          make per minute, e.g. 120, with bursts up to the same number;
                          beyond it the page answers 429 Too Many Requests. 0 removes
                          the limit.
                        format: int64
                        maximum: 100000
                        minimum: 0
                        type: integer
                      showDetails:
                        description: Show what blocked the name (the list, rule, blocked
                          service, safe search or policy), looked up in the recent
                          query log. Off shows only the domain, the client, the node
                          and the time, which keeps your list choices private.
                        type: boolean
                      title:
                        description: Heading of the block page, e.g. This site is
                          blocked (plain text, at most 200 characters).
                        maxLength: 8192
                        type: string
                    type: object
                  blocking:
                    properties:
                      allowDegraded:
                        description: Answer queries and report ready while blocklists
                          are still loading, e.g. right after a restart; queries are
                          filtered by the lists already loaded. Off, the node reports
                          not ready until every referenced list is loaded, so load
                          balancers keep traffic away.
                        type: boolean
                      blockTTL:
                        description: 'How long devices may remember a block answer,
                          e.g. 10m, unless the Policy sets blockTTL. Keep it short:
                          after you allow a name, devices keep the cached block until
                          it expires.'
                        maxLength: 8192
                        type: string
                      catalogue:
                        properties:
                          adguardServicesURL:
                            description: 'Off when empty. Opt-in: a URL of AdGuard''s
                              HostlistsRegistry blocked-services file, e.g. https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/main/assets/services.json,
                              adds its services (about 140) to the catalogue next
                              to kudurru''s own; kudurru''s entries win when both
                              have an ID. That data is GPL-3.0 licensed: kudurru does
                              not ship it, your instance downloads it (the leader,
                              on the catalogue refresh interval; the other nodes copy
                              the leader''s), and the dashboard marks those services
                              as from AdGuard (GPL-3.0). Check that the licence suits
                              how you use and share the data. docs/deploy/blocked-services.md.'
                            maxLength: 8192
                            type: string
                          refreshInterval:
                            description: How often the catalogue at blocking.catalogue.url
                              and the AdGuard services at blocking.catalogue.adguardServicesURL
                              are checked for a new version, e.g. 24h; at least 1m.
                              A conditional GET, so an unchanged document is not downloaded
                              again.
                            maxLength: 8192
                            type: string
                          url:
                            description: Leave empty to use the blocked-services and
                              safe-search catalogue built into kudurru. A URL, e.g.
                              https://example.com/kudurru-catalogue.json, replaces
                              it with your own document (schema version 2, or 1, docs/deploy/blocked-services.md).
                              The leader downloads it and the other nodes copy the
                              leader's; a document that fails validation leaves the
                              current catalogue in service.
                            maxLength: 8192
                            type: string
                        type: object
                      customIP:
                        properties:
                          v4:
                            description: IPv4 address blocked A queries are answered
                              with when the block response is customIP, e.g. 192.168.1.10
                              for a server of yours that shows a notice. Empty answers
                              NODATA.
                            maxLength: 8192
                            type: string
                          v6:
                            description: IPv6 address blocked AAAA queries are answered
                              with when the block response is customIP, e.g. fd00::10.
                              Empty answers NODATA.
                            maxLength: 8192
                            type: string
                        type: object
                      defaultResponse:
                        description: What a blocked query is answered with, unless
                          the client's Policy (blockMode) or the BlockList (response)
                          chooses otherwise. zeroIP (default) makes the connection
                          fail at once and suits most networks; blockPage shows browsers
                          a page that explains the block; refused is discouraged,
                          because devices then ask another DNS server.
                        enum:
                        - zeroIP
                        - nxdomain
                        - customIP
                        - refused
                        - blockPage
                        maxLength: 8192
                        type: string
                      enabled:
                        description: Block ads, trackers and other listed names for
                          the whole network; off answers every query unfiltered. To
                          pause blocking for a while, use the temporary disable on
                          the dashboard instead (a runtime toggle, not this key).
                          Applies to forwarded queries, not to your own zones.
                        type: boolean
                      initStrategy:
                        description: 'What happens at start while blocklists load:
                          fast (default) serves at once using the copies saved on
                          disk; blocking waits until every list is loaded; failOnError
                          also exits when a list cannot be loaded.'
                        enum:
                        - fast
                        - blocking
                        - failOnError
                        maxLength: 8192
                        type: string
                      refreshInterval:
                        description: How often blocklists are downloaded again when
                          a list sets no refreshInterval of its own, e.g. 24h; at
                          least 1m. In a cluster the leader downloads and the other
                          nodes copy its result by digest.
                        maxLength: 8192
                        type: string
                    type: object
                  branding:
                    properties:
                      accentColor:
                        description: 'Six-digit hexadecimal accent color, e.g. #2457A6,
                          for the dashboard and block page. Enterprise only. Accessible
                          text and interaction colors are derived from it; empty keeps
                          the selected theme''s accent.'
                        maxLength: 8192
                        type: string
                      favicon:
                        description: Static PNG data URL for the browser icon, at
                          most 64 KiB decoded and 256 pixels per dimension. Enterprise
                          only. Empty uses the built-in icon. Upload through the Branding
                          editor.
                        maxLength: 87406
                        type: string
                      logoDark:
                        description: Static PNG data URL for dark surfaces, at most
                          64 KiB decoded and 1024 pixels per dimension. Enterprise
                          only. Empty uses the light logo if supplied, otherwise built-in
                          artwork. Upload through the Branding editor; remote URLs
                          and SVG are not accepted.
                        maxLength: 87406
                        type: string
                      logoLight:
                        description: Static PNG data URL for light surfaces, at most
                          64 KiB decoded and 1024 pixels per dimension. Enterprise
                          only. Empty uses the dark logo if supplied, otherwise built-in
                          artwork. Upload through the Branding editor; remote URLs
                          and SVG are not accepted.
                        maxLength: 87406
                        type: string
                      name:
                        description: Public display name on the dashboard, sign-in
                          and block page. Enterprise only. At most 80 characters;
                          empty uses kudurru. Saved branding is retained when the
                          license no longer permits it.
                        maxLength: 8192
                        type: string
                    type: object
                  cache:
                    properties:
                      maxEntries:
                        description: How many answers the cache holds, e.g. 200000;
                          when it is full the least recently used answer is dropped.
                          More entries mean more cache hits and more memory; 0 turns
                          the cache off.
                        format: int64
                        minimum: 0
                        type: integer
                      maxTTL:
                        description: Longest time an answer stays cached, even when
                          its record asks for more, e.g. 24h; lower it so changed
                          addresses show up sooner. 0 sets no upper limit.
                        maxLength: 8192
                        type: string
                      minTTL:
                        description: Shortest time an answer stays cached, even when
                          its record asks for less, e.g. 5s. Raising it saves upstream
                          queries but keeps changed addresses longer; 0 honors every
                          record's TTL.
                        maxLength: 8192
                        type: string
                      negativeTTL:
                        description: Longest time a "does not exist" answer (NXDOMAIN
                          or NODATA) stays cached, e.g. 5m; shorter lets a newly created
                          name resolve sooner. Below it the zone's SOA minimum applies
                          (RFC 2308).
                        maxLength: 8192
                        type: string
                      prefetch:
                        properties:
                          threshold:
                            description: 'Refresh popular answers shortly before they
                              expire, so nobody waits for the upstream: an answer
                              asked for this many times within cache.prefetch.window
                              counts as popular, e.g. 5. 0 turns prefetching off.'
                            format: int64
                            minimum: 0
                            type: integer
                          window:
                            description: Time over which the hits for cache.prefetch.threshold
                              are counted, e.g. 2h.
                            maxLength: 8192
                            type: string
                        type: object
                      serveStale:
                        properties:
                          answerTTL:
                            description: TTL given to an expired answer served this
                              way, e.g. 30s, so clients ask again soon; after a failed
                              refresh, queries for the entry also stop waiting for
                              the upstream for this long. 0 means 30s (RFC 8767).
                            maxLength: 8192
                            type: string
                          maxWait:
                            description: How long a query for an expired entry waits
                              for a fresh upstream answer before the expired one is
                              sent, e.g. 1800ms; 0 means 1800ms (RFC 8767 client response
                              timer).
                            maxLength: 8192
                            type: string
                          ttl:
                            description: When every upstream server fails, keep answering
                              from expired cache entries for up to this long after
                              they expired, e.g. 72h, so names you already use keep
                              working through an outage. 0 turns it off (RFC 8767
                              serve-stale).
                            maxLength: 8192
                            type: string
                        type: object
                    type: object
                  control:
                    properties:
                      allowedNetworks:
                        description: Client networks allowed to query DNS, for example
                          192.168.1.0/24 or fd00::/64. Empty allows all clients; loopback
                          always passes this network check. Other clients receive
                          REFUSED before local, cached or upstream answers. At most
                          1024 IPv4 or IPv6 CIDRs; changes take effect without restart.
                        items:
                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                      blockedQTypes:
                        description: DNS query types refused for every client, including
                          loopback, for example ANY or HINFO. Empty blocks none. At
                          most 256 case-insensitive DNS mnemonics or explicit TYPE1
                          through TYPE65535 values; changes take effect before local,
                          cached or upstream answers without restart. Malformed queries
                          still drop silently.
                        items:
                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                    type: object
                  database:
                    properties:
                      querylog:
                        properties:
                          facts:
                            description: Copy the individual queries, not only the
                              statistics. At 1000 queries per second that is about
                              25 GB a day before retention; off keeps the cluster-wide
                              charts, totals and top lists but the All nodes query
                              log is empty.
                            type: boolean
                          retention:
                            properties:
                              raw:
                                description: 'How long individual queries are kept
                                  in the central database, e.g. 168h (7 days); whole
                                  days are dropped. 0 keeps them. Statistics are kept
                                  like on the nodes: per minute 35 days, per hour
                                  400 days, per day forever.'
                                maxLength: 8192
                                type: string
                            type: object
                          ship:
                            description: With database.dsn set, every node copies
                              its query log and statistics into the central database,
                              so the dashboard's All nodes view shows every node's
                              queries and totals whichever node serves it. Each node
                              keeps its own querylog.db too. Needs querylog.sink sqlite.
                            type: boolean
                        type: object
                    type: object
                  dnssec:
                    properties:
                      enabled:
                        description: Validate forwarded DNS answers against the configured
                          trust anchors. Invalid or incomplete proofs return SERVFAIL
                          with an extended DNS error; unsigned delegations still work.
                          Off by default for compatibility. A forward zone can override
                          this default with spec.forward.dnssecValidation.
                        type: boolean
                      negativeTrustAnchors:
                        description: Temporary exceptions for broken signed domains
                          (RFC 7646); at most 128. Every exception needs a reason
                          and an absolute expiry no more than seven days away. It
                          covers the domain and descendants, never sets AD, and stops
                          applying at expiry even on cache hits. Reload and restart
                          do not extend it.
                        items:
                          properties:
                            domain:
                              description: Domain whose signatures temporarily cannot
                                be checked, e.g. broken.example; includes its descendants.
                              maxLength: 8192
                              type: string
                            expiresAt:
                              description: Absolute RFC3339 expiry, e.g. 2026-10-15T12:00:00Z;
                                no more than seven days from now. Expired entries
                                are harmless and can be removed.
                              maxLength: 8192
                              type: string
                            reason:
                              description: Why validation is temporarily bypassed,
                                in at most 256 characters; record the incident or
                                repair being tracked.
                              maxLength: 8192
                              type: string
                          required:
                          - domain
                          - reason
                          - expiresAt
                          type: object
                        maxItems: 10000
                        type: array
                      trustAnchors:
                        description: Additional trusted DS or DNSKEY records in DNS
                          presentation format, e.g. a complete DS record for a private
                          signed zone. At most 64. With useBuiltinAnchors off these
                          replace the shipped root anchors, and at least one is required.
                          Changes invalidate the old validation cache context immediately.
                        items:
                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                      useBuiltinAnchors:
                        description: Trust the IANA root DS records shipped with this
                          version. Software upgrades or an operator change maintain
                          these anchors; no keys are trusted automatically from upstream
                          responses. Turn off only when dnssec.trustAnchors supplies
                          all trust roots you need.
                        type: boolean
                    type: object
                  querylog:
                    properties:
                      anonymize:
                        description: 'How client addresses are hidden under the anonymize_client
                          privacy mode: prefix keeps only the network (IPv4 /24, IPv6
                          /48), so devices in one network look alike; pseudonym replaces
                          each address with a code that is stable for a day and cannot
                          be reversed.'
                        enum:
                        - prefix
                        - pseudonym
                        maxLength: 8192
                        type: string
                      enabled:
                        description: Record the queries each node answers, for the
                          dashboard's query log, statistics and charts; off records
                          nothing and those pages stay empty. Each node keeps its
                          own log (querylog.db with rollups, the stats API).
                        type: boolean
                      exclude:
                        properties:
                          clients:
                            description: 'Clients whose queries are never logged,
                              e.g. 192.168.1.20, 10.0.0.0/8 or a client name such
                              as nas: IP addresses, CIDR prefixes or client names.'
                            items:
                              maxLength: 8192
                              type: string
                            maxItems: 10000
                            type: array
                          domains:
                            description: 'Names that are never logged, e.g. *.home.arpa
                              or connectivitycheck.gstatic.com: exact names, *.suffix
                              for a domain and everything below it, or /regex/.'
                            items:
                              maxLength: 8192
                              type: string
                            maxItems: 10000
                            type: array
                          sudn:
                            description: 'Leave out names that never leave the local
                              network, which keeps local discovery noise out of the
                              log: localhost, .local, .home.arpa and private and link-local
                              reverse zones (special-use names, RFC 6761).'
                            type: boolean
                        type: object
                      privacy:
                        description: 'How much of each query is kept: full keeps everything;
                          the other modes hide client addresses, query names or both,
                          and nothing keeps only per-minute totals. Applied once when
                          the query is recorded, so it cannot be undone for queries
                          already logged. Only full stores the answer summary.'
                        enum:
                        - full
                        - anonymize_client
                        - hide_domains
                        - hide_domains_clients
                        - nothing
                        maxLength: 8192
                        type: string
                      retention:
                        properties:
                          maxDBBytes:
                            description: Largest size of the query log database on
                              each node, e.g. 10GiB; when it is exceeded the oldest
                              queries are deleted first. 0 removes the cap.
                            maxLength: 8192
                            type: string
                          raw:
                            description: 'How long individual queries are kept, e.g.
                              720h (30 days); 0 keeps them until querylog.retention.maxDBBytes
                              is reached. The totals behind the charts are kept longer:
                              per minute for 35 days, per hour for 400 days, per day
                              forever.'
                            maxLength: 8192
                            type: string
                        type: object
                      sink:
                        description: 'Where queries are recorded: sqlite (default)
                          keeps them in a database the dashboard reads; slog writes
                          one JSON log line per query and stores nothing, for an external
                          log system.'
                        enum:
                        - sqlite
                        - slog
                        maxLength: 8192
                        type: string
                    type: object
                  ratelimit:
                    properties:
                      enabled:
                        description: Limit how many queries per minute one address
                          or network may send over UDP, which blunts floods and reflection
                          attacks. TCP, DoT, DoH, DoQ and DoH3 are never limited,
                          nor loopback clients and the health name.
                        type: boolean
                      exempt:
                        description: Addresses or networks that are never rate limited,
                          e.g. 192.168.1.0/24 for your LAN or the address of a busy
                          resolver that forwards to kudurru. Loopback always is.
                        items:
                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                      ipv4:
                        additionalProperties:
                          format: int64
                          minimum: 0
                          type: integer
                        description: 'Queries per minute allowed per IPv4 address
                          or network, by prefix length: 32 is one address (default
                          600), 24 a /24 network (default 6000). Entries merge with
                          the defaults key by key, and 0 turns a level off. Each prefix
                          has a token bucket holding one minute''s allowance.'
                        maxProperties: 10000
                        type: object
                      ipv6:
                        additionalProperties:
                          format: int64
                          minimum: 0
                          type: integer
                        description: 'Queries per minute allowed per IPv6 address
                          or network, by prefix length: 128 is one address (default
                          600), 64 a /64 network (6000), 56 a /56 (12000). Entries
                          merge with the defaults key by key, and 0 turns a level
                          off.'
                        maxProperties: 10000
                        type: object
                      maxBuckets:
                        description: Most addresses and networks tracked at once,
                          e.g. 65536 (0 means 65536); the least recently seen is forgotten
                          first and starts again with a full allowance.
                        format: int64
                        minimum: 0
                        type: integer
                      slip:
                        description: Share of over-limit queries, in percent from
                          0 to 100, answered with an empty truncated reply (TC=1)
                          instead of being dropped, e.g. 50; real clients then retry
                          over TCP, which is not limited. 0 drops them all, 100 answers
                          them all.
                        format: int64
                        maximum: 100
                        minimum: 0
                        type: integer
                    type: object
                  response:
                    properties:
                      bogusNXDOMAIN:
                        description: Return NXDOMAIN when a forwarded answer contains
                          an address in one of these networks, for upstreams that
                          redirect missing domains to a search page. At most 256 canonical
                          IPv4 or IPv6 CIDRs. This result is never immediately changed
                          by the NXDOMAIN replacement settings.
                        items:
                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                      dns64:
                        properties:
                          excludeDomains:
                            description: Domains and descendants excluded from DNS64,
                              e.g. internal.example. At most 256. Both the question
                              and the final alias target are checked.
                            items:
                              maxLength: 8192
                              type: string
                            maxItems: 10000
                            type: array
                          excludeIPv4:
                            description: IPv4 networks excluded from DNS64, e.g. 192.168.0.0/16.
                              At most 256 canonical CIDRs. Excluded addresses never
                              become synthetic IPv6 answers.
                            items:
                              maxLength: 8192
                              type: string
                            maxItems: 10000
                            type: array
                          prefix:
                            description: Synthesize IPv6 answers from IPv4 for a NAT64
                              network. Empty disables DNS64. Use your router's IPv6
                              /32, /40, /48, /56, /64 or /96 translation prefix, e.g.
                              64:ff9b::/96. Only AAAA NODATA answers are synthesized;
                              queries requesting DNSSEC proofs keep the original response.
                              A Policy can override this for selected clients.
                            maxLength: 8192
                            type: string
                        type: object
                      filterAAAA:
                        description: Remove IPv6 addresses and IPv6 service hints
                          from forwarded responses. AAAA answers become NODATA. This
                          takes precedence over DNS64 and clears DNSSEC authenticity
                          on changed answers. A Policy can override this for selected
                          clients; owned authoritative zones are unaffected.
                        type: boolean
                      nxdomainIPv4:
                        description: Replace upstream NXDOMAIN for A questions with
                          these IPv4 addresses. Empty preserves NXDOMAIN. At most
                          16 addresses. This deliberately changes validated negative
                          answers and clears AD; rebinding protection still applies
                          to the replacement.
                        items:
                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                      nxdomainIPv6:
                        description: Replace upstream NXDOMAIN for AAAA questions
                          with these IPv6 addresses. Empty preserves NXDOMAIN. At
                          most 16 addresses. Disabled for clients with IPv6 filtering
                          enabled; rebinding protection still applies.
                        items:
                          maxLength: 8192
                          type: string
                        maxItems: 10000
                        type: array
                      rebinding:
                        properties:
                          bypassNetworks:
                            description: Client networks exempt from rebinding protection.
                              At most 256 canonical IPv4 or IPv6 CIDRs. Empty protects
                              all clients; an explicit /0 disables protection for
                              that address family.
                            items:
                              maxLength: 8192
                              type: string
                            maxItems: 10000
                            type: array
                          enabled:
                            description: Refuse forwarded or rewritten answers containing
