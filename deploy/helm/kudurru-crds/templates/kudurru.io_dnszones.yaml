---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: dnszones.kudurru.io
spec:
  group: kudurru.io
  names:
    kind: DNSZone
    listKind: DNSZoneList
    plural: dnszones
    shortNames:
    - zone
    singular: dnszone
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.zoneName
      name: ZONE
      type: string
    - jsonPath: .spec.type
      name: TYPE
      type: string
    - jsonPath: .status.serial
      name: SERIAL
      type: integer
    - jsonPath: .status.recordCount
      name: RECORDS
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DNSZone is a recorded grant of authority over a name space: the stone kept
          in the temple.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DNSZoneSpec defines the desired state of a zone.
            properties:
              defaultTTL:
                default: 300
                format: int32
                type: integer
              dnssec:
                description: |-
                  DNSSECSpec is reserved for v1.0 signing. The schema exists so that the
                  seam is in place (dev-docs/design-record.md §13.1).
                properties:
                  algorithm:
                    default: ECDSAP256SHA256
                    enum:
                    - ECDSAP256SHA256
                    - ED25519
                    type: string
                  denial:
                    default: nsec
                    enum:
                    - nsec
                    - nsec3
                    type: string
                  enabled:
                    type: boolean
                  keySecretRef:
                    description: |-
                      ObjectRef points at another kudurru object. Namespace is omitted for
                      cluster-scoped kinds and for same-namespace references.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - enabled
                type: object
              external:
                description: ExternalSpec synthesises records from Kubernetes objects
                  (v0.2).
                properties:
                  gateway:
                    type: boolean
                  ingress:
                    type: boolean
                  loadBalancerServices:
                    type: boolean
                type: object
              fallback:
                description: |-
                  Fallback enables public resolution for names not defined locally. Omit
                  it to remain authoritative for the entire zone. Generated apex SOA/NS
                  records do not suppress fallback for other types at an unconfigured apex.
                  Zones with fallback do not support zone transfers or NOTIFY.
                properties:
                  upstreamGroup:
                    description: |-
                      UpstreamGroup selects a forwarding or recursive group. Empty uses normal
                      resolver routing (client policy, conditional forwarding, then default).
                    type: string
                type: object
              forward:
                description: ForwardSpec configures a forward zone.
                properties:
                  dnssecValidation:
                    type: boolean
                  upstreamGroup:
                    default: default
                    description: UpstreamGroup names a group in the Kudurru settings.
                    type: string
                type: object
              nameservers:
                items:
                  type: string
                type: array
              policy:
                description: |-
                  ZonePolicy controls who may query, transfer, be notified about and update
                  the zone.
                properties:
                  notify:
                    default: none
                    description: NotifyMode selects where NOTIFY messages are sent
                      on serial change.
                    enum:
                    - none
                    - zoneNameServers
                    - specified
                    - both
                    type: string
                  notifyTargets:
                    items:
                      type: string
                    type: array
                  queryACL:
                    description: |-
                      QueryACL entries are CIDRs, optionally negated with a leading "!".
                      Ordered, first match wins, default deny.
                    items:
                      type: string
                    type: array
                  queryAccess:
                    default: allow
                    description: |-
                      AccessMode is Technitium's six-way access vocabulary applied to queries,
                      transfers and dynamic updates.
                    enum:
                    - deny
                    - allow
                    - allowOnlyPrivate
                    - allowOnlyZoneNameServers
                    - useNetworkACL
                    - zoneNameServersAndACL
                    type: string
                  transferACL:
                    items:
                      type: string
                    type: array
                  transferTSIGKeyRefs:
                    items:
                      type: string
                    type: array
                  update:
                    default: deny
                    description: Update controls RFC 2136 dynamic updates (v0.2).
                    enum:
                    - deny
                    - allow
                    - allowOnlyPrivate
                    - allowOnlyZoneNameServers
                    - useNetworkACL
                    - zoneNameServersAndACL
                    type: string
                  updatePolicies:
                    items:
                      description: UpdatePolicy grants a TSIG key the right to update
                        names and types (v0.2).
                      properties:
                        name:
                          description: Name is an owner name or wildcard pattern within
                            the zone.
                          type: string
                        tsigKeyRef:
                          type: string
                        types:
                          items:
                            type: string
                          type: array
                      required:
                      - name
                      - tsigKeyRef
                      type: object
                    type: array
                  zoneTransfer:
                    default: deny
                    description: |-
                      AccessMode is Technitium's six-way access vocabulary applied to queries,
                      transfers and dynamic updates.
                    enum:
                    - deny
                    - allow
                    - allowOnlyPrivate
                    - allowOnlyZoneNameServers
                    - useNetworkACL
                    - zoneNameServersAndACL
                    type: string
                type: object
              publish:
                items:
                  description: |-
                    PublishRule selects records for an outbound RecordSink integration (v0.2),
                    the split-horizon mechanism of decision D29.
                  properties:
                    integrationRef:
                      description: |-
                        ObjectRef points at another kudurru object. Namespace is omitted for
                        cluster-scoped kinds and for same-namespace references.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                    policy:
                      default: sync
                      enum:
                      - sync
                      - upsert-only
                      - create-only
                      type: string
                    selector:
                      description: |-
                        A label selector is a label query over a set of resources. The result of matchLabels and
                        matchExpressions are ANDed. An empty label selector matches all objects. A null
                        label selector matches no objects.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    types:
                      items:
                        type: string
                      type: array
                  required:
                  - integrationRef
                  type: object
                type: array
              recordSetSelector:
                description: RecordSetSelector restricts which DNSRecordSets may add
                  records to the zone.
                properties:
                  labelSelector:
                    description: |-
                      A label selector is a label query over a set of resources. The result of matchLabels and
                      matchExpressions are ANDed. An empty label selector matches all objects. A null
                      label selector matches no objects.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    items:
                      type: string
                    type: array
                type: object
              secondary:
                description: SecondarySpec configures a secondary zone (v0.2).
                properties:
                  primaries:
                    items:
                      type: string
                    type: array
                  transferProtocol:
                    default: tcp
                    enum:
                    - tcp
                    - tls
                    type: string
                  tsigKeyRef:
                    type: string
                required:
                - primaries
                type: object
              soa:
                description: |-
                  SOASpec holds the SOA fields the operator controls. The serial is computed
                  by the leader and lives in status (decision D12).
                properties:
                  expire:
                    default: 1209600
                    format: int32
                    type: integer
                  minimum:
                    default: 300
                    format: int32
                    type: integer
                  mname:
                    type: string
                  refresh:
                    default: 3600
                    format: int32
                    type: integer
                  retry:
                    default: 900
                    format: int32
                    type: integer
                  rname:
                    type: string
                type: object
              stub:
                description: StubSpec configures a stub zone (v0.2).
                properties:
                  nameservers:
                    items:
                      type: string
                    type: array
                required:
                - nameservers
                type: object
              type:
                description: ZoneType selects how a zone gets its data.
                enum:
                - primary
                - forward
                - secondary
                - stub
                - external
                - catalog
                - secondaryCatalog
                type: string
              zoneName:
                description: ZoneName is the fully qualified zone name with a trailing
                  dot.
                minLength: 1
                pattern: ^([a-zA-Z0-9_-]+\.)*$|^\.$
                type: string
                x-kubernetes-validations:
                - message: zoneName is immutable
                  rule: self == oldSelf
            required:
            - type
            - zoneName
            type: object
            x-kubernetes-validations:
            - message: fallback is only supported for primary zones
              rule: '!has(self.fallback) || self.type == ''primary'''
          status:
            description: DNSZoneStatus is the observed state of a zone.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentHash:
                description: ContentHash is the sha256 of the canonical RRsets.
                type: string
              nameserverAddresses:
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              published:
                items:
                  description: PublicationStatus reports the state of one outbound
                    sink for the zone.
                  properties:
                    conflicts:
                      type: integer
                    drift:
                      type: integer
                    integration:
                      type: string
                    lastSyncTime:
                      format: date-time
                      type: string
                    managed:
                      type: integer
                  required:
                  - integration
                  type: object
                type: array
              recordCount:
                type: integer
              serial:
                description: |-
                  Serial is stamped by the leader as max(prev+1, unix_now) whenever
                  ContentHash changes. Replicas serve this value.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
