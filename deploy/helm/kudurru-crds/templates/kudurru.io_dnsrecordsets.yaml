---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: dnsrecordsets.kudurru.io
spec:
  group: kudurru.io
  names:
    kind: DNSRecordSet
    listKind: DNSRecordSetList
    plural: dnsrecordsets
    shortNames:
    - rrset
    singular: dnsrecordset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.zoneRef.name
      name: ZONE
      type: string
    - jsonPath: .status.names
      name: NAMES
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DNSRecordSet is a set of records that belong to a DNSZone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DNSRecordSetSpec defines records added to a zone. App teams own these:
              the clay copies of authority delegated from a DNSZone.
            properties:
              endpoints:
                items:
                  description: |-
                    Endpoint is a superset of the external-dns Endpoint: one owner name and
                    record type with one or more targets in presentation format.
                  properties:
                    dnsName:
                      minLength: 1
                      type: string
                    kudurru:
                      description: EndpointExt is the kudurru extension block on an
                        Endpoint (decision D28).
                      properties:
                        comment:
                          type: string
                        disabled:
                          description: Disabled records are kept but never served.
                          type: boolean
                        expiresAt:
                          description: ExpiresAt removes the record from service after
                            this time.
                          format: date-time
                          type: string
                        view:
                          description: |-
                            View is "public" (published to sinks, never served) or a ClientGroup
                            name (served only to that group). v0.2.
                          type: string
                      type: object
                    labels:
                      additionalProperties:
                        type: string
                      type: object
                    providerSpecific:
                      items:
                        description: |-
                          ProviderSpecific carries a per-sink override, e.g. cloudflare/proxied.
                          The shape matches external-dns so endpoints round-trip unchanged.
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                        required:
                        - name
                        - value
                        type: object
                      type: array
                    recordTTL:
                      format: int64
                      type: integer
                    recordType:
                      pattern: ^([A-Z0-9]+|TYPE[0-9]+)$
                      type: string
                    setIdentifier:
                      type: string
                    targets:
                      items:
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - dnsName
                  - recordType
                  - targets
                  type: object
                maxItems: 1000
                type: array
              zoneRef:
                description: |-
                  ObjectRef points at another kudurru object. Namespace is omitted for
                  cluster-scoped kinds and for same-namespace references.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: zoneRef is immutable
                  rule: self == oldSelf
            required:
            - endpoints
            - zoneRef
            type: object
          status:
            description: DNSRecordSetStatus is the observed state of a record set.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              names:
                type: integer
              observedGeneration:
                format: int64
                type: integer
              publications:
                items:
                  description: PublicationState reports whether one sink has programmed
                    the record set.
                  properties:
                    integration:
                      type: string
                    message:
                      type: string
                    state:
                      enum:
                      - Accepted
                      - Programmed
                      - Failed
                      type: string
                  required:
                  - integration
                  - state
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
