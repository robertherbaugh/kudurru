module:
  mounts:
    # The site's own pages, templates and styles.
    - {source: content, target: content}
    - {source: layouts, target: layouts}
    - {source: assets, target: assets}
    # Files served as they are: _headers (Cloudflare response headers).
    - {source: static, target: static}

    # The user and administrator guide (docs/guide). Its images are served from
    # the site itself (render-image.html), not from raw.githubusercontent.com:
    # the repository can be private, and a public site must not depend on it.
    - {source: ../docs/guide/README.md, target: content/guide/_index.md}
    - {source: ../docs/guide/dashboard/README.md, target: content/guide/dashboard/_index.md}
    - {source: ../docs/guide/admin/README.md, target: content/guide/admin/_index.md}
    - {source: ../docs/guide/first-steps/README.md, target: content/guide/first-steps/_index.md}
    - {source: ../docs/guide/filtering/README.md, target: content/guide/filtering/_index.md}
    - {source: ../docs/guide/dhcp/README.md, target: content/guide/dhcp/_index.md}
    - {source: ../docs/guide/dhcp/kubernetes/README.md, target: content/guide/dhcp/kubernetes/_index.md}
    - {source: ../docs/guide/local-dns/README.md, target: content/guide/local-dns/_index.md}
    - source: ../docs/guide
      target: content/guide
      files: ['! README.md', '! dashboard/README.md', '! admin/README.md', '! first-steps/README.md', '! filtering/README.md', '! dhcp/README.md', '! dhcp/kubernetes/README.md', '! local-dns/README.md', '! images/**']

    - {source: ../docs/guide/images, target: static/guide/images}

    # User and operator guides, runbooks.
    - {source: ../docs/enterprise.md, target: content/enterprise.md}
    - {source: ../docs/deploy/README.md, target: content/deploy/_index.md}
    - {source: ../docs/deploy, target: content/deploy, files: ['! README.md']}

    # The architecture tour (docs/architecture). Its hand-drawn diagrams are
    # files of the site (render-image.html), like the guide's screenshots;
    # its Mermaid diagrams are drawn in the browser by the vendored bundle
    # (docs-site/vendor/mermaid, render-codeblock-mermaid.html).
    - {source: ../docs/architecture/README.md, target: content/architecture/_index.md}
    - source: ../docs/architecture
      target: content/architecture
      files: ['! README.md', '! diagrams/**']
    - {source: ../docs/architecture/diagrams, target: static/architecture/diagrams}

    # Project files from the repository root.
    - {source: ../CHANGELOG.md, target: content/project/changelog.md}
    - {source: ../SECURITY.md, target: content/project/security.md}
    - {source: ../CONTRIBUTING.md, target: content/project/contributing.md}
    # License summaries, the core Community License, the commercial agreement
    # and folder-specific notices, each published from its repository source.
    - {source: ../LICENSING.md, target: content/project/licensing.md}
    - {source: ../LICENSE, target: content/project/license.md}
    - {source: ../COMMERCIAL_LICENSE_AGREEMENT.md, target: content/project/commercial-license.md}
    - {source: ../ee/LICENSE.md, target: content/project/enterprise-license.md}
    - {source: LICENSE.md, target: content/project/documentation-license.md}
    - {source: ../website/LICENSE.md, target: content/project/website-license.md}
    - {source: ../license-server/LICENSE.md, target: content/project/license-server-license.md}

    # Brand (branding): palette and the artwork the templates use.
    - {source: ../branding/tokens.css, target: assets/css/tokens.css}
    - source: ../branding/assets
      target: static/brand
      files:
        - favicon.ico
        - kudurru-icon-192.png
        - kudurru-icon-512.png
        - kudurru-logo-mixed.png
        - kudurru-logo-mixed-paper.png
        - kudurru-logo-mixed-tagline.png
        - kudurru-logo-mixed-paper-tagline.png
        - kudurru-mark-clay.png
        - kudurru-social.png

    # REST reference: the OpenAPI document and the self-hosted Scalar
    # bundle (MIT; `make docs-assets` decompresses it into .generated/).
    - {source: ../api/openapi.json, target: static/reference/api/openapi.json}
    - {source: ../internal/api/scalar/LICENSE, target: static/reference/api/scalar-LICENSE.txt}
    - {source: .generated/scalar, target: assets/scalar}

    # Mermaid (MIT): `make docs-assets` decompresses docs-site/vendor/mermaid.
    - {source: .generated/mermaid, target: assets/mermaid}
    - {source: vendor/mermaid/LICENSE, target: static/architecture/mermaid-LICENSE.txt}
