name: pinned-interop
on:
  pull_request:
    paths:
      - .github/workflows/interop.yml
      - go.mod
      - go.sum
      - cmd/kudurru/**
      - ee/edge/**
      - images/dnsdist/**
      - internal/**
      - test/interop/**
      - hack/lab-dockerd.sh
      - hack/pinned-interop.sh
      - hack/test-knot-*.sh
      - hack/test-dnsdist-live.sh
  push:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinned-interop-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pinned:
    name: ${{ matrix.suite }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [knot, dnsdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run digest-pinned live suites on a private Docker daemon
        env:
          CGO_ENABLED: '1'
          INTEROP_SUITE: ${{ matrix.suite }}
        run: hack/lab-dockerd.sh "$INTEROP_SUITE" "$RUNNER_TEMP/pinned-interop"
      - name: Retain image identities, program versions, and per-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinned-interop-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinned-interop/
          if-no-files-found: error
          retention-days: 14
