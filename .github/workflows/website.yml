# Checks the kudurru.io website (website/) on every change that can affect it:
# typecheck, the tests (pages, links, CSP, _headers), the build and
# `wrangler deploy --dry-run`. Cloudflare Workers Builds deploys the site
# from GitHub itself; this workflow holds no Cloudflare credentials.
# website/README.md, "Deploying".
name: website
on:
  push:
    branches: [main]
    paths:
      - website/**
      - branding/**
      - docs/guide/images/**
      - VERSION
      - LICENSE
      - LICENSING.md
      - COMMERCIAL_LICENSE_AGREEMENT.md
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - branding/**
      - docs/guide/images/**
      - VERSION
      - LICENSE
      - LICENSING.md
      - COMMERCIAL_LICENSE_AGREEMENT.md
      - .github/workflows/website.yml
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  website:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Typecheck, test, build and check the Workers config
        env:
          WRANGLER_SEND_METRICS: "false"
        run: make website-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
