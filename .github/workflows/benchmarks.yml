name: release benchmark measurements
on:
  workflow_dispatch:
  # Allows an explicitly requested measurement before this workflow is merged
  # to the default branch (where GitHub registers workflow_dispatch).
  pull_request:
    types: [labeled]
permissions:
  contents: read
# Do not cancel an in-progress sample or share its measurement runner with
# another invocation of this workflow. Artifacts never update the baseline.
concurrency:
  group: release-benchmark-measurements
  cancel-in-progress: false
jobs:
  measure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'release-benchmarks' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Owner selected Ubicloud 8-core Ubuntu 24.04 on November 8, 2026.
    # Retain the original six-processor workload on the eight-core host.
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Measure the exact candidate, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the collector
        run: python3 -B -m unittest discover -s hack -p test_bench_release.py
      - name: Record original workloads in fresh processes
        env:
          BENCH_RUNNER_CLASS: ubicloud-standard-8-ubuntu-2404
          BENCH_PROCS: "6"
        run: >-
          python3 hack/bench-release.py --output bin/release-benchmarks
          --runner-class "$BENCH_RUNNER_CLASS" --procs "$BENCH_PROCS"
      - name: Retain calibration evidence, including failed commands
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-benchmarks-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: bin/release-benchmarks/
          if-no-files-found: error
          retention-days: 30
