# feature -> main: every push to a pull request against main builds
# ghcr.io/robertherbaugh/kudurru:dev-<PR number> from the PR's head commit,
# with the dashboard bundle, for linux/amd64 and linux/arm64. Later pushes
# overwrite the same tag; `kudurru version` reports <VERSION>-dev.<PR> and
# the commit. Built from the Dockerfile (the release images come from
# goreleaser + ko in publish.yml). Pull requests from forks and Dependabot
# get a read-only token and are skipped. A pull request that changes
# nothing outside docs/, site/, www/ and license-server/ builds no image:
# those directories supply no image assets (the same gate as ci.yml; the
# license portal has its own image, license-server.yml).
# docs/release-checklist.md, "Release pipeline".
name: dev-image
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: dev-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Same check as ci.yml's changes job: false only when every file the pull
  # request changes is under docs/, site/, www/ or license-server/.
  changes:
    runs-on: ubicloud-standard-2-ubuntu-2404
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && files=$(git diff --name-only "$BASE...$HEAD"); then
            if [[ -n "$files" ]] && ! grep -Eqv '^(docs|site|www|license-server)/' <<<"$files"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # ghcr.io image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Build the dashboard bundle
        run: make web-build
      - name: Version and image tag
        id: meta
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "tag=ghcr.io/robertherbaugh/kudurru:dev-${PR}"
            echo "version=$(tr -d '[:space:]' < VERSION)-dev.${PR}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      # The Dockerfile cross-compiles on the build platform and the final
      # stages only copy the binary, so arm64 needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ steps.meta.outputs.tag }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/robertherbaugh/kudurru
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.title=kudurru
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max
      - name: Summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Dev image"
            echo
            echo "\`docker pull ${TAG}\` (\`kudurru version\`: ${VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"
