# Publishes a tagged release: goreleaser (archives, deb/rpm/apk, ko images,
# the GitHub release), the Helm charts, the -hostnetwork image and the
# supervisor images, all cosign-signed. Called by release-candidate.yml (v<VERSION>-rc.<N>, a GitHub
# pre-release, no `latest`) and release.yml (v<VERSION>, `latest`) after they
# push the tag; workflow_dispatch re-publishes an existing tag by hand. A
# release candidate's pushed images are then scanned with Trivy (the scan
# job).
# dev-docs/release-checklist.md, "Release pipeline".
name: publish
on:
  workflow_call:
    inputs:
      tag:
        description: Existing git tag to publish (v<version> or v<version>-rc.<N>)
        type: string
        required: true
      previous-tag:
        description: Tag the changelog starts from (empty lets goreleaser pick)
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (v<version> or v<version>-rc.<N>)
        type: string
        required: true
      previous-tag:
        description: Tag the changelog starts from (empty lets goreleaser pick)
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  # The tests run in their own job with a read-only token and no Go module
  # or build cache: nothing a test (or a poisoned cache entry) does can reach
  # the release job's write permissions or signing identity.
  test:
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Test before publishing
        run: make test
      - name: Chart render matrix and kubeconform
        run: make helm-check
  release:
    needs: test
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: write        # GitHub release and assets
      packages: write        # ghcr.io images and Helm charts
      id-token: write        # cosign keyless signing, provenance
      attestations: write    # SLSA build provenance
    steps:
      # The tag must be a release tag, and a hand-run publish must start from
      # a release branch: the signing identity (publish.yml@<branch>) is what
      # `cosign verify` checks (dev-docs/release-checklist.md, section 5).
      - name: Check the tag and the branch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::tag ${TAG} is not v<MAJOR.MINOR.PATCH> or v<MAJOR.MINOR.PATCH>-rc.<N>"; exit 1
          fi
          if [[ "${GITHUB_REF}" != refs/heads/release && "${GITHUB_REF}" != refs/heads/release-candidate ]]; then
            echo "::error::publish runs from the release or release-candidate branch, not ${GITHUB_REF}"; exit 1
          fi
      # refs/tags/: a bare name would check out a branch of the same name
      # first. No credentials stay in .git/config for the build and tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # goreleaser's before hook builds the dashboard bundle into dashboard/dist.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      # goreleaser's sboms run syft on the archives and packages; the runner
      # image has no syft, and the step fails only after the builds.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The ko images' base: distroless with /var/lib/kudurru and
      # /run/kudurru owned by 65532, which ko cannot create (a fresh named
      # volume takes their owner; images/base/Dockerfile). goreleaser gets
      # the pushed digests, not the tags.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Base image tags
        id: basetag
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push ghcr.io/robertherbaugh/kudurru-base:${{ steps.basetag.outputs.version }}
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: true
          tags: ghcr.io/robertherbaugh/kudurru-base:${{ steps.basetag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/robertherbaugh/kudurru
            org.opencontainers.image.licenses=LicenseRef-Kudurru-Community
            org.opencontainers.image.title=kudurru-base
      - name: Build and push ghcr.io/robertherbaugh/kudurru-base:${{ steps.basetag.outputs.version }}-debug
        id: debugbase
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=gcr.io/distroless/static:debug-nonroot@sha256:2a581fcbda6320d4d17fd6ff4774bb96e4825d2be9c2bca59f0777b429997f51
          sbom: true
          tags: ghcr.io/robertherbaugh/kudurru-base:${{ steps.basetag.outputs.version }}-debug
          labels: |
            org.opencontainers.image.source=https://github.com/robertherbaugh/kudurru
            org.opencontainers.image.licenses=LicenseRef-Kudurru-Community
            org.opencontainers.image.title=kudurru-base
      - name: Sign the base images by digest
        run: |
          cosign sign --yes "ghcr.io/robertherbaugh/kudurru-base@${{ steps.base.outputs.digest }}"
          cosign sign --yes "ghcr.io/robertherbaugh/kudurru-base@${{ steps.debugbase.outputs.digest }}"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/robertherbaugh/kudurru
          KUDURRU_BASE_IMAGE: ghcr.io/robertherbaugh/kudurru-base@${{ steps.base.outputs.digest }}
          KUDURRU_DEBUG_BASE_IMAGE: ghcr.io/robertherbaugh/kudurru-base@${{ steps.debugbase.outputs.digest }}
          # A release commit can carry both its last rc tag and the release
          # tag; name the one being published.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ inputs.previous-tag }}
      - name: Verify the ko image signatures (docker_signs, artifacts manifests)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          for ref in "ghcr.io/robertherbaugh/kudurru:${version}" "ghcr.io/robertherbaugh/kudurru:${version}-debug"; do
            cosign verify "${ref}" \
              --certificate-identity-regexp '^https://github\.com/robertherbaugh/kudurru/\.github/workflows/publish\.yml@refs/heads/release(-candidate)?$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified ${ref}"
          done
      # SLSA build provenance for the ko images, pushed next to them (the
      # archives' provenance is the step below); goreleaser attaches their
      # SPDX SBOMs. Artifact attestations in a private repository need GitHub
      # Enterprise Cloud, so every provenance step here runs only while the
      # repository is public; the cosign signatures and SBOMs do not depend
      # on it.
      - name: Resolve the ko image digests
        id: ko
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          for v in plain debug; do
            ref="ghcr.io/robertherbaugh/kudurru:${version}"; [ "$v" = debug ] && ref="${ref}-debug"
            digest=$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${v}=${digest}" >> "$GITHUB_OUTPUT"
          done
      - name: Build provenance for ghcr.io/robertherbaugh/kudurru
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/robertherbaugh/kudurru
          subject-digest: ${{ steps.ko.outputs.plain }}
          push-to-registry: true
      - name: Build provenance for ghcr.io/robertherbaugh/kudurru (-debug)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/robertherbaugh/kudurru
          subject-digest: ${{ steps.ko.outputs.debug }}
          push-to-registry: true
      - name: Fresh named volumes are writable in the released images
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          hack/volume-check.sh "ghcr.io/robertherbaugh/kudurru:${version}" "ghcr.io/robertherbaugh/kudurru:${version}-debug"
      - name: Build provenance for the release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
      - name: Push the Helm charts to oci://ghcr.io/robertherbaugh/charts
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p bin/charts
          for chart in kudurru-crds kudurru; do
            helm package "deploy/helm/${chart}" --version "${version}" --app-version "${version}" -d bin/charts
            out=$(helm push "bin/charts/${chart}-${version}.tgz" oci://ghcr.io/robertherbaugh/charts 2>&1)
            echo "${out}"
            digest=$(echo "${out}" | awk '/^Digest:/ {print $2}')
            cosign sign --yes "ghcr.io/robertherbaugh/charts/${chart}@${digest}"
          done
  hostnetwork-image:
    # <version>-hostnetwork: the binary of the ko image the release job just
    # pushed with the file capability cap_net_bind_service=+ep, which ko
    # cannot set (images/hostnetwork/Dockerfile). The chart's
    # hostNetwork.enabled runs it: the ip_unprivileged_port_start sysctl is
    # not available on the host network. The final stage only copies files,
    # so arm64 needs no QEMU.
    needs: release
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # ghcr.io image
      id-token: write        # cosign keyless signing, provenance
      attestations: write    # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the tags (<version>-hostnetwork, latest-hostnetwork for a release)
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          tags="ghcr.io/robertherbaugh/kudurru:${version}-hostnetwork"
          case "${version}" in
            *-*) ;;
            *) tags="${tags},ghcr.io/robertherbaugh/kudurru:latest-hostnetwork" ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      # Build FROM the digest the release job signed, not the tag, which
      # anything with packages: write could move in between (V3).
      - name: Resolve and verify the kudurru image digest
        id: base
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/robertherbaugh/kudurru:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify "ghcr.io/robertherbaugh/kudurru@${digest}" \
            --certificate-identity-regexp '^https://github\.com/robertherbaugh/kudurru/\.github/workflows/publish\.yml@refs/heads/release(-candidate)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "image=ghcr.io/robertherbaugh/kudurru@${digest}" >> "$GITHUB_OUTPUT"
      - name: Build and push ghcr.io/robertherbaugh/kudurru:${{ steps.tag.outputs.version }}-hostnetwork
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/hostnetwork
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: true
          build-args: |
            KUDURRU_IMAGE=${{ steps.base.outputs.image }}
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/robertherbaugh/kudurru
            org.opencontainers.image.licenses=LicenseRef-Kudurru-Community
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}-hostnetwork
            org.opencontainers.image.title=kudurru
            org.opencontainers.image.description=kudurru with cap_net_bind_service=+ep for host networking
      - name: Sign the image by digest
        run: cosign sign --yes "ghcr.io/robertherbaugh/kudurru@${{ steps.build.outputs.digest }}"
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/robertherbaugh/kudurru
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Fresh named volumes are writable in the image
        run: hack/volume-check.sh "ghcr.io/robertherbaugh/kudurru@${{ steps.build.outputs.digest }}"
  supervisor-images:
    # kudurru-dnsdist and kudurru-keepalived aggregate the GPL programs with
    # the kudurru supervisor binary from the ko image the release job just
    # pushed (images/*/Dockerfile, dev-docs/release-checklist.md §4). Each
    # platform builds natively on its own runner (keepalived compiles from
    # source, which took minutes under QEMU) and is pushed by digest only;
    # supervisor-manifests below joins the two into the tagged index.
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # ghcr.io images
    strategy:
      fail-fast: false
      matrix:
        image: [dnsdist, keepalived]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubicloud-standard-2-ubuntu-2404
          - platform: arm64
            runner: ubicloud-standard-2-arm-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build FROM the digest the release job signed, not the tag, which
      # anything with packages: write could move in between.
      - name: Resolve and verify the kudurru image digest
        id: base
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          digest=$(docker buildx imagetools inspect "ghcr.io/robertherbaugh/kudurru:${version}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify "ghcr.io/robertherbaugh/kudurru@${digest}" \
            --certificate-identity-regexp '^https://github\.com/robertherbaugh/kudurru/\.github/workflows/publish\.yml@refs/heads/release(-candidate)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "image=ghcr.io/robertherbaugh/kudurru@${digest}" >> "$GITHUB_OUTPUT"
      - name: Build and push ghcr.io/robertherbaugh/kudurru-${{ matrix.image }} for linux/${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          platforms: linux/${{ matrix.platform }}
          provenance: false
          sbom: true
          build-args: |
            KUDURRU_IMAGE=${{ steps.base.outputs.image }}
          outputs: type=image,name=ghcr.io/robertherbaugh/kudurru-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST}" > "${RUNNER_TEMP}/digests/${PLATFORM}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supervisor-digest-${{ matrix.image }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/${{ matrix.platform }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  supervisor-manifests:
    # The linux/amd64 and linux/arm64 builds of each supervisor image as one
    # index under <program version>-k<kudurru version>, cosign-signed and
    # attested by digest.
    needs: supervisor-images
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write        # ghcr.io images
      id-token: write        # cosign keyless signing, provenance
      attestations: write    # SLSA build provenance
    strategy:
      fail-fast: false
      matrix:
        image: [dnsdist, keepalived]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the image tag (<program version>-k<kudurru version>)
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ matrix.image }}
        run: |
          version="${TAG#v}"
          case "${IMAGE}" in
            dnsdist)    program=$(sed -n 's/^FROM powerdns\/dnsdist-[0-9]*:\([^@]*\)@.*$/\1/p' images/dnsdist/Dockerfile) ;;
            keepalived) program=$(sed -n 's/^ARG KEEPALIVED_VERSION=\(.*\)$/\1/p' images/keepalived/Dockerfile) ;;
          esac
          test -n "${program}"
          echo "tag=${program}-k${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: supervisor-digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      # The digest that gets signed comes from the index itself, not from the
      # tag, which anything with packages: write could move between the push
      # and a lookup (V3): --dry-run prints the exact index the push writes,
      # whose sha256 (without the trailing newline, which $(...) strips) is
      # its digest. The tag must point at it after the push.
      - name: Push ghcr.io/robertherbaugh/kudurru-${{ matrix.image }}:${{ steps.tag.outputs.tag }} (linux/amd64 and linux/arm64)
        id: build
        env:
          REPO: ghcr.io/robertherbaugh/kudurru-${{ matrix.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sources=()
          for platform in amd64 arm64; do
            digest=$(cat "${RUNNER_TEMP}/digests/${platform}")
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("${REPO}@${digest}")
          done
          index=$(docker buildx imagetools create --dry-run -t "${REPO}:${TAG}" "${sources[@]}")
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' <<<"${index}" > /dev/null
          digest="sha256:$(printf '%s' "${index}" | sha256sum | cut -d' ' -f1)"
          docker buildx imagetools create -t "${REPO}:${TAG}" "${sources[@]}"
          pushed=$(docker buildx imagetools inspect "${REPO}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "${pushed}" != "${digest}" ]]; then
            echo "::error::${REPO}:${TAG} points at ${pushed}, not the pushed index ${digest}"; exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the image by digest
        run: cosign sign --yes "ghcr.io/robertherbaugh/kudurru-${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/robertherbaugh/kudurru-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  scan:
    # Release candidates only: Trivy on the images the jobs above pushed, as
    # pulled from ghcr.io (`make trivy-published`), not the Dockerfile builds
    # security.yml scans. A finding fails the run, and release.yml and the
    # promotion check refuse to release a candidate whose run failed
    # (hack/candidate-published.sh): fix it on main and cut a new candidate.
    # A release ships its candidate's tree, so its publish does not scan
    # again; security.yml rescans the latest release daily.
    needs: [release, hostnetwork-image, supervisor-manifests]
    if: contains(inputs.tag, '-rc.')
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read         # pull the ghcr.io images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy on the published images
        env:
          TAG: ${{ inputs.tag }}
        run: make trivy-published PUBLISHED_TAG="${TAG}"
