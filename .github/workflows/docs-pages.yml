name: docs-pages
# Publishes the docs site to GitHub Pages for a release (called by
# release.yml with the v<VERSION> tag), or when started by hand. Repository
# settings → Pages → Source must be "GitHub Actions", and the github-pages
# environment must allow deployments from the release branch (the caller's
# ref). Links from the site to repository files point at the tag (or
# branch) that was built.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag to build the site from
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # refs/tags/: a bare tag name would check out a branch of the same
      # name first. Started by hand, the branch it runs on is built.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          HUGO_PARAMS_REPOREF: ${{ inputs.ref || github.ref_name }}
        run: make docs-site HUGO_FLAGS="--minify --gc --cleanDestinationDir --panicOnWarning --baseURL ${BASE_URL}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
