name: docs-pages
# Publishes the docs site to GitHub Pages for a release tag, or when started
# by hand. Repository settings → Pages → Source must be "GitHub Actions".
# Links from the site to repository files point at the tag (or branch)
# that was built.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          HUGO_PARAMS_REPOREF: ${{ github.ref_name }}
        run: make docs-site HUGO_FLAGS="--minify --gc --cleanDestinationDir --panicOnWarning --baseURL ${BASE_URL}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
