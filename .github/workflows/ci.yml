name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify generated files are current
        run: make check-generated
      - name: Vet
        run: make vet
      # kube-apiserver and etcd for the kube driver tests: keyed on the
      # Makefile, which pins ENVTEST_K8S_VERSION and the setup-envtest version.
      - name: Cache envtest control-plane binaries
        id: envtest-cache
        uses: actions/cache@v4
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install envtest control-plane binaries
        if: steps.envtest-cache.outputs.cache-hit != 'true'
        run: make envtest
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Binary-size budget (D75)
        run: make size
      - name: Smoke test the binary
        run: ./bin/kudurru version
  # The dashboard SPA (web/, D69): lint, typecheck, unit tests with MSW,
  # the production bundle with its size budget, and the Go embed test
  # against the real bundle.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build (fails over the initial-load budget)
        run: bun run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Embed the built bundle
        working-directory: .
        run: go test -count=1 ./web/...
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: OIDC login end to end against dex
        run: make test-auth-e2e
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
  # Chart, kustomize, compose, dashboard and alert-rule checks
  # (docs/m3/deploy.md): helm lint, the values render matrix with every
  # rendered kudurru.yaml loaded through config.Load, the kustomize overlays,
  # and kubeconform against the Kubernetes 1.30 schemas and the CRDs.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: Cache kubeconform schemas and tools
        uses: actions/cache@v4
        with:
          path: |
            bin/kubeconform-cache
            bin/deploy-tools
          key: deploy-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Render matrix, kustomize overlays, kubeconform
        run: make helm-check
      - name: Generated deployment assets are current
        run: |
          make deploy-assets
          git diff --exit-code -- charts config deploy
      - name: goreleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Deny copyleft modules
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --disallowed_types=forbidden,restricted
