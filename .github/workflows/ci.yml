# Runners (every workflow): Ubicloud, billed per minute and linearly in
# vCPUs, so a larger runner only pays off when the job speeds up about as
# much as the core count grows. Measured on the same topology (2 vCPU = 1
# physical core): the `go` job's steps take 1318 s on 2 vCPU, 675 s on 4 and
# 551 s on 8; vitest 263 s, 92 s and 57 s (it runs cores-1 workers). Jobs
# that compile Go or run parallel test workers (go, dashboard, dashboard-e2e, e2e,
# dev-image, edge, publish's test and release) use standard-4: half the wall
# time for about the same cost, and the `go` job is the critical path of
# this workflow. Short, network-bound or wait-bound jobs, the build job and
# the fuzz shards (60 s of fuzzing a target whatever the size) stay on
# standard-2; the supervisor images build natively on standard-2 x64 and
# arm64 runners instead of under QEMU. 8 vCPU doubles the price per minute
# for 18 % less time on the `go` job, about 1.6x the cost per run; two
# standard-4 shards cut its test step about in half instead.
# Pinned to Ubuntu 24.04, the image ubuntu-latest was.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request cancels the run of the previous one (about a
# fifth of the runs, October 2026). Other events group by commit: GitHub
# replaces a pending run in a group even without cancel-in-progress, so a
# shared group for main could leave a commit with no run (and no cache save).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Changes confined to docs/, dev-docs/, docs-site/, website/, branding/
  # and license-server/ skip the jobs below (hack/ci-changes.sh code);
  # docs.yml, website.yml and license-server.yml still check them.
  changes:
    runs-on: ubicloud-standard-2-ubuntu-2404
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        # bash -o pipefail: a failing filter fails the job instead of skipping
        # every gated job.
        shell: bash
        run: hack/ci-changes.sh code | tee -a "$GITHUB_OUTPUT"
  # The unit and integration tests under the race detector, in two shards
  # of packages balanced by their test time (hack/go-test-shard.sh). Each
  # shard keeps its own Go build and module cache, saved by main and
  # restored by pull requests (the shared setup-go cache is saved by
  # whichever job of the commit finishes first, which compiled other
  # packages).
  go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: go test ${{ matrix.shard }}/2
    # PostgreSQL for the central-database tests (internal/central, D158):
    # with KUDURRU_REQUIRE_POSTGRES they fail instead of skipping.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: kudurru
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      KUDURRU_TEST_POSTGRES_DSN: postgres://postgres:kudurru@127.0.0.1:55432/postgres?sslmode=disable
      KUDURRU_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build and module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-test-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-
      # kube-apiserver and etcd for the kube driver tests: keyed on the
      # Makefile, which pins ENVTEST_K8S_VERSION and the setup-envtest version.
      - name: Cache envtest control-plane binaries
        id: envtest-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install envtest control-plane binaries
        if: steps.envtest-cache.outputs.cache-hit != 'true'
        run: make envtest
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: make test TEST_PKGS="$(hack/go-test-shard.sh "$SHARD" 2 | tr '\n' ' ')"
      # Only what this run used: go marks a cache entry used by touching it
      # (when it is over an hour old), so the cache does not grow forever.
      - name: Drop cache entries this run did not use (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -type f -mmin +90 -delete
      - name: Save the Go build and module cache (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
  # Generated files, the release build (CGO_ENABLED=0) with its size
  # budget and a smoke test of the binary, beside the tests rather than
  # after them. The docs references are checked by `make test`
  # (TestReferenceDrift, TestCLIReferenceDrift) and docs.yml.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build and module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify generated files are current
        run: make check-generated-code
      - name: Build
        run: make build
      - name: Binary-size budget (D75)
        run: make size
      - name: Smoke test the binary
        run: ./bin/kudurru version
      - name: Drop cache entries this run did not use (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -type f -mmin +90 -delete
      - name: Save the Go build and module cache (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
  # The central-database tests on the oldest and newest supported
  # PostgreSQL (16 and 18); the go job runs 17, the preferred version.
  # Only the packages that reach the server: the SQLite query-log
  # throughput tests do not belong on this 2-core runner.
  postgres:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          - postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: kudurru
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      KUDURRU_TEST_POSTGRES_DSN: postgres://postgres:kudurru@127.0.0.1:55432/postgres?sslmode=disable
      KUDURRU_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Central-database tests
        run: |
          go test -count=1 ./internal/central/...
          go test -count=1 -run '^TestDoctorDatabase$' ./cmd/kudurru
  # The dashboard SPA (dashboard/, D69): lint, typecheck, unit tests with MSW,
  # the production bundle with its size budget, and the Go embed test
  # against the real bundle.
  dashboard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build (fails over the initial-load budget)
        run: bun run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Embed the built bundle
        working-directory: .
        run: go test -count=1 ./dashboard/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7
  # The dashboard against a real `kudurru serve` (dashboard/e2e, Playwright):
  # the embedded bundle, the real API shapes and real DNS traffic, every
  # page in Chromium. The HTML report and the traces of failed tests are
  # uploaded when it fails.
  dashboard-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install (frozen lockfile)
        working-directory: dashboard
        run: bun install --frozen-lockfile
      # Keyed on bun.lock, which pins the Playwright version.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/bun.lock') }}
      - name: Install Playwright chromium
        working-directory: dashboard
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = true ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      - name: Build the bundle and the binary, run the suite
        run: make dashboard-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 14
  # End to end (dev-docs/milestones/m5/e2e.md): `kudurru serve` processes on loopback
  # (two nodes, lameduck, restarts, config and port failures), BIND 9 as a
  # secondary and as a forwarding target, and the OIDC login against dex.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install BIND 9
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bind9 bind9-utils
          # The packaged service is not needed; the tests start their own
          # named as the runner user with configuration under $TMPDIR, which
          # the usr.sbin.named AppArmor profile would deny.
          sudo systemctl stop named || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.named || true
          /usr/sbin/named -v
      - name: Cache dex
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/dex-*
          key: dex-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: kudurru end to end and BIND interop
        env:
          KUDURRU_NAMED: /usr/sbin/named
        run: make e2e
      - name: OIDC login end to end against dex
        run: make test-auth-e2e
      - name: Blocking conformance against pinned AdGuard Home
        run: make test-adguard
  # Stock-client DHCP interoperability, entirely inside a disconnected outer
  # network namespace. Installing dhcpcd-base does not enable a host DHCP daemon.
  dhcp-acceptance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install stock DHCP client and namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dhcpcd-base iproute2 jq tcpdump util-linux libcap2-bin
          /usr/sbin/dhcpcd --version
      - name: Disconnected DHCPv4 lifecycle, probes, relays and options
        env:
          DHCPCD: /usr/sbin/dhcpcd
        run: bash test/dhcp/run.sh
      - name: Preserve isolated lab evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhcp-acceptance
          include-hidden-files: true
          path: |
            .context/dhcp-acceptance.*/
            !.context/dhcp-acceptance.*/fixture
          retention-days: 14
  # Fuzzing: every target of hack/fuzz.sh for 60 s, in seven shards of two
  # or three consecutive targets fuzzed one after another (about 5 min a
  # shard, no longer than the go shards), so a package's instrumented test
  # binary is built once per shard rather than once per target (a job per
  # target spent more on setup and compiling than on fuzzing).
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    name: fuzz ${{ matrix.shard }}/7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each target for 60 s
        env:
          FUZZTIME: 60s
          FUZZ_PARALLEL: 2
          SHARD: ${{ matrix.shard }}
        run: hack/fuzz.sh --shard "$SHARD/7"
      - name: Upload the crasher
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crasher-${{ matrix.shard }}
          path: |
            **/testdata/fuzz/
            bin/fuzz/
          retention-days: 14
  # go vet's own analyzers, beside the tests (about 4 min on 2 vCPU, which
  # would make lint the slowest job if it ran there).
  vet:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: make vet
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
  # Chart, kustomize, compose, dashboard and alert-rule checks
  # (dev-docs/milestones/m3/deploy.md): helm lint, the values render matrix with every
  # rendered kudurru.yaml loaded through config.Load, the kustomize overlays,
  # and kubeconform against the Kubernetes 1.30 schemas and the CRDs.
  helm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Cache kubeconform schemas and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/kubeconform-cache
            bin/deploy-tools
          key: deploy-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Render matrix, kustomize overlays, kubeconform
        run: make helm-check
      - name: Release version references are current
        run: make version-check
      - name: Generated deployment assets are current
        run: |
          make deploy-assets
          git diff --exit-code -- deploy
      - name: goreleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check
  licenses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Deny copyleft modules
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --disallowed_types=forbidden,restricted
  # The one check to watch and to require: it passes when every job above
  # passed or was skipped (docs-only changes) and fails otherwise. It runs
  # even when a job fails, rather than being skipped, because a skipped job
  # satisfies a required status check; the same goes for a canceled run.
  # Add new jobs to needs.
  ci-ok:
    needs: [changes, go, build, postgres, dashboard, dashboard-e2e, e2e, dhcp-acceptance, fuzz, vet, lint, helm, licenses]
    if: always()
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
