name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify generated files are current
        run: make check-generated
      - name: Vet
        run: make vet
      # kube-apiserver and etcd for the kube driver tests: keyed on the
      # Makefile, which pins ENVTEST_K8S_VERSION and the setup-envtest version.
      - name: Cache envtest control-plane binaries
        id: envtest-cache
        uses: actions/cache@v4
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install envtest control-plane binaries
        if: steps.envtest-cache.outputs.cache-hit != 'true'
        run: make envtest
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Binary-size budget (D75)
        run: make size
      - name: Smoke test the binary
        run: ./bin/kudurru version
  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: OIDC login end to end against dex
        run: make test-auth-e2e
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint charts/kudurru charts/kudurru-crds
      - run: helm template kudurru charts/kudurru > /dev/null
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Deny copyleft modules
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --disallowed_types=forbidden,restricted
