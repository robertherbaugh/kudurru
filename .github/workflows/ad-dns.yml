name: ad-dns
on:
  push:
    branches: [main]
    paths:
      - dev-docs/spikes/ad-dns/**
      - hack/labs/ad-samba/**
      - hack/test-ad-samba.py
      - Makefile
      - .golangci.yml
      - .github/workflows/ad-dns.yml
  pull_request:
    paths:
      - dev-docs/spikes/ad-dns/**
      - hack/labs/ad-samba/**
      - hack/test-ad-samba.py
      - Makefile
      - .golangci.yml
      - .github/workflows/ad-dns.yml
permissions:
  contents: read
concurrency:
  group: ad-dns-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  probe:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dev-docs/spikes/ad-dns/go.mod
          cache-dependency-path: dev-docs/spikes/ad-dns/go.sum
      - name: Install independent Kerberos and DNS tools
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-kdc krb5-admin-server krb5-user bind9-dnsutils
      - name: Vet, race tests, MIT interoperability and cgo-free build
        env:
          KUDURRU_AD_MIT_TEST: "1"
        run: make ad-dns-check
      - name: Samba AD Kerberos and signed-refusal interoperability
        run: python3 hack/test-ad-samba.py --build
      - name: Retain sanitized Samba protocol evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: samba-ad-protocol
          path: .context/ad-samba-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Lint the isolated module
        working-directory: dev-docs/spikes/ad-dns
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --config ../../../.golangci.yml ./...
      - name: Dependency licenses
        working-directory: dev-docs/spikes/ad-dns
        # The probe's own source has the repository's Community License.
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --disallowed_types=forbidden,restricted --ignore github.com/robertherbaugh/kudurru/dev-docs/spikes/ad-dns
