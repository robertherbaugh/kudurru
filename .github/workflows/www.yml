# Checks the kudurru.io website (www/) on every change that can affect it:
# typecheck, the tests (pages, links, CSP, _headers), the build and
# `wrangler deploy --dry-run`. Cloudflare Workers Builds deploys the site
# from GitHub itself; this workflow holds no Cloudflare credentials.
# www/README.md, "Deploying".
name: www
on:
  push:
    branches: [main]
    paths:
      - www/**
      - docs/brand/**
      - docs/guide/images/**
      - VERSION
      - .github/workflows/www.yml
  pull_request:
    paths:
      - www/**
      - docs/brand/**
      - docs/guide/images/**
      - VERSION
      - .github/workflows/www.yml
permissions:
  contents: read
jobs:
  site:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Typecheck, test, build and check the Workers config
        env:
          WRANGLER_SEND_METRICS: "false"
        run: make www-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: www-site
          path: www/dist
          retention-days: 7
