# Optional: validates the rendered dnsdist and keepalived configurations with
# the real programs inside the pinned images (`make edge-check`). It is not a
# required check until the project settles a runner policy for Docker builds
# (keepalived is compiled from source, a few minutes); failures are reported
# but do not block merges. docs/m3/edge.md.
name: edge
on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/edge/**
      - cmd/kudurru/edge.go
      - cmd/kudurru/vip.go
      - images/**
      - .github/workflows/edge.yml
  push:
    branches: [main]
    paths:
      - internal/edge/**
      - images/**
permissions:
  contents: read
jobs:
  edge-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate golden configurations in the pinned dnsdist and keepalived images
        run: make edge-check
