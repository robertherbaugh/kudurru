# Validates the rendered dnsdist and keepalived configurations with the real
# programs inside the pinned images (`make edge-check`): builds the kudurru
# image and both supervisor images (keepalived is compiled from source, a few
# minutes), then runs `dnsdist --check-config` on the 12 golden dnsdist files
# and `keepalived -t` on the 4 golden keepalived files. A failure fails the
# workflow; make it a required check on main. docs/m3/edge.md.
name: edge
on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/edge/**
      - cmd/kudurru/edge.go
      - cmd/kudurru/vip.go
      - images/**
      - Dockerfile
      - .github/workflows/edge.yml
  push:
    branches: [main]
    paths:
      - internal/edge/**
      - images/**
permissions:
  contents: read
jobs:
  edge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate golden configurations in the pinned dnsdist and keepalived images
        run: make edge-check
