# Dependabot keeps the SHA-pinned GitHub Actions current (the workflows pin
# every third-party action by commit with the version as a comment, which
# Dependabot updates together). One grouped pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
